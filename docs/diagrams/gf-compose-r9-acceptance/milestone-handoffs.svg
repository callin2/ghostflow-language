<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="533px" preserveAspectRatio="none" style="width:503px;height:533px;background:#FFFFFF;" version="1.1" viewBox="0 0 503 533" width="503px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=b2e743baac88d3ac79362b45dff45106697e7140f9c9383cfcb2e520b436dc86 plantuml=1.2024.7 --><title>Proposed milestone handoffs (subject to architecture-owner review)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="453.5303" x="18.1124" y="20.7803">Proposed milestone handoffs (subject to architecture-owner review)</text><!--entity R--><g id="elem_R"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="184.0298" x="7" y="48.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="150.2744" x="17" y="68.5103">Architecture-owner review</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.1289" x="17" y="81.5103">(research completion grants</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.0298" x="17" y="94.5103">no implementation authority)</text></g><!--entity M1--><g id="elem_M1"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="216.5361" x="70.75" y="202"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.7725" x="80.75" y="222.0103">M1: Apply a prepared behavior</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.918" x="80.75" y="235.0103">contract descriptors, input kind,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="196.5361" x="80.75" y="248.0103">exclusive ownership, logical ports,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.0234" x="80.75" y="261.0103">accepted/rejected result</text></g><!--entity M2--><g id="elem_M2"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="197.7661" x="160.13" y="335"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="149.5952" x="170.13" y="355.0103">M2: Add another behavior</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.7661" x="170.13" y="368.0103">instance-qualified composition,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.2153" x="170.13" y="381.0103">isolated state/timers,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.8462" x="170.13" y="394.0103">preserved bindings</text></g><!--entity M3--><g id="elem_M3"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="232.4624" x="218.78" y="468"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="212.4624" x="228.78" y="488.0103">M3: Investigate an unexpected result</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.7788" x="228.78" y="501.0103">instance-qualified source/constraint</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1353" x="228.78" y="514.0103">trace joined to run/scan</text></g><!--entity G--><g id="elem_G"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="271.4751" x="226.28" y="42"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="125.0107" x="236.28" y="62.0103">Owner decision gates</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="195.7998" x="236.28" y="75.0103">compiler/runtime, package/import,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="251.4751" x="236.28" y="88.0103">installation constraint, instance/deployment,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="205.2578" x="236.28" y="101.0103">binding evidence, incident evidence</text></g><!--link R to M1--><g id="link_R_M1"><path d="M113.69,107.98 C127.04,134.35 144.0809,167.9964 158.3609,196.2164 " fill="none" id="R-to-M1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="161.07,201.57,160.5755,191.7336,158.8125,197.1087,153.4374,195.3456,161.07,201.57" style="stroke:#181818;stroke-width:1.0;"/></g><!--link M1 to M2--><g id="link_M1_M2"><path d="M200.66,274.45 C212.05,293.09 222.8315,310.7602 234.2215,329.4002 " fill="none" id="M1-to-M2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="237.35,334.52,236.0705,324.7546,234.7429,330.2535,229.2441,328.9259,237.35,334.52" style="stroke:#181818;stroke-width:1.0;"/></g><!--link M2 to M3--><g id="link_M2_M3"><path d="M280.59,407.34 C292.26,426.47 303.3754,444.6578 314.3554,462.6578 " fill="none" id="M2-to-M3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="317.48,467.78,316.208,458.0136,314.8762,463.5115,309.3784,462.1797,317.48,467.78" style="stroke:#181818;stroke-width:1.0;"/></g><!--link G to M1--><g id="link_G_M1"><path d="M233.85,114.49 C220.35,122.44 207.95,132.15 198.01,144 C184.68,159.91 180.3259,176.7073 178.8759,195.7373 " fill="none" id="G-to-M1" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="178.42,201.72,183.0922,193.0499,178.7999,196.7345,175.1153,192.4421,178.42,201.72" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="59.2617" x="22