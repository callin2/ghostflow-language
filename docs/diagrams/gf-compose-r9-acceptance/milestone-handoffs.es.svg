<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="533px" preserveAspectRatio="none" style="width:606px;height:533px;background:#FFFFFF;" version="1.1" viewBox="0 0 606 533" width="606px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=5ceff874a58afcf4f8b2a70c385688191f931fda095d4894ead1c75dc4fd46d6 plantuml=1.2024.7 --><title>Traspasos de hitos propuestos (sujetos a revisi&#243;n del responsable de arquitectura)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="554.7021" x="18.8719" y="20.7803">Traspasos de hitos propuestos (sujetos a revisi&#243;n del responsable de arquitectura)</text><!--entity R--><g id="elem_R"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="255.5869" x="7" y="48.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.5869" x="17" y="68.5103">Revisi&#243;n del responsable de arquitectura</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="212.4497" x="17" y="81.5103">(completar la investigaci&#243;n no otorga</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2661" x="17" y="94.5103">autoridad de implementaci&#243;n)</text></g><!--entity M1--><g id="elem_M1"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="262.7915" x="97.4" y="202"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7915" x="107.4" y="222.0103">M1: Aplicar un comportamiento preparado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.0342" x="107.4" y="235.0103">descriptores de contrato, tipo de entrada,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.7197" x="107.4" y="248.0103">titularidad exclusiva, puertos l&#243;gicos,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.9033" x="107.4" y="261.0103">resultado aceptado/rechazado</text></g><!--entity M2--><g id="elem_M2"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="230.9961" x="200.3" y="335"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.6943" x="210.3" y="355.0103">M2: A&#241;adir otro comportamiento</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.9961" x="210.3" y="368.0103">composici&#243;n calificada por instancia,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="187.1606" x="210.3" y="381.0103">estado/temporizadores aislados,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.1943" x="210.3" y="394.0103">vinculaciones preservadas</text></g><!--entity M3--><g id="elem_M3"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="278.0005" x="260.79" y="468"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7451" x="270.79" y="488.0103">M3: Investigar un resultado inesperado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="207.3843" x="270.79" y="501.0103">traza de fuente/restricci&#243;n calificada</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.0005" x="270.79" y="514.0103">por instancia, vinculada a ejecuci&#243;n/escaneo</text></g><!--entity G--><g id="elem_G"><rect fill="#F1F1F1" height="72" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="303.2959" x="297.15" y="42"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="233.4224" x="307.15" y="62.0103">Puertas de decisi&#243;n de los responsables</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="239.1797" x="307.15" y="75.0103">compilador/runtime, paquete/importaci&#243;n,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="270.9878" x="307.15" y="88.0103">restricci&#243;n de instalaci&#243;n, instancia/despliegue,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="283.2959" x="307.15" y="101.0103">evidencia de vinculaci&#243;n, evidencia de incidentes</text></g><!--link R to M1--><g id="link_R_M1"><path d="M152.03,107.98 C167.72,134.35 187.8635,168.1928 204.6435,196.4128 " fill="none" id="R-to-M1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="207.71,201.57,206.5483,191.7899,205.1546,197.2724,199.6721,195.8786,207.71,201.57" style="stroke:#181818;stroke-width:1.0;"/></g><!--link M1 to M2--><g id="link_M1_M2"><path d="M252.34,274.45 C264.72,293.09 276.5305,310.8819 288.9105,329.5219 " fill="none" id="M1-to-M2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="292.23,334.52,290.5827,324.8099,289.4637,330.3549,283.9187,329.2359,292.23,334.52" style="stroke:#181818;stroke-width:1.0;"/></g><!--link M2 to M3--><g id="link_M2_M3"><path d="M339.64,407.34 C352.54,426.47 364.9151,444.8056 377.0551,462.8056 " fill="none" id="M2-to-M3" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="380.41,467.78,378.6938,458.0818,377.6142,463.6347,372.0613,462.5551,380.41,467.78" style="stroke:#181818;stroke-width:1.0;"/></g><!--link G to M1--><g id="link_G_M1"><path d="M296.76,108.36 C278.34,117.29 261.3,128.9 247.79,144 C233.84,159.6 229.4585,176.6232 228.1785,195.8532 " fill="none" id="G-to-M1" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="227.78,201.84,232.3689,193.1255,228.1121,196.851,224.3866,192.5942,227.78,201.84" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.8462" x="269.0136" y="155.0103">solo condicionan</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.2935" x="248.79" y="168.0103">los tramos que las usan</text></g><!--link G to M2--><g id="link_G_M2"><path d="M438.51,114.5 C426.37,154.35 404.41,220.44 377.79,274 C367.37,294.96 356.7737,312.0451 344.7137,329.7051 " fill="none" id="G-to-M2" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="341.33,334.66,349.7088,329.4835,344.1497,330.5309,343.1023,324.9719,341.33,334.66" style="stroke:#181818;stroke-width:1.0;"/></g><!--link G to M3--><g id="link_G_M3"><path d="M454.5,114.2 C463.12,175.07 475.77,303.4 448.79,407 C443.12,428.77 434.2506,445.914 423.4906,462.754 " fill="none" id="G-to-M3" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="420.26,467.81,428.4765,462.3797,422.9521,463.5966,421.7352,458.0722,420.26,467.81" style="stroke:#181818;stroke-width:1.0;"/></g></g></svg>