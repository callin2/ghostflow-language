<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="608px" preserveAspectRatio="none" style="width:905px;height:608px;background:#FFFFFF;" version="1.1" viewBox="0 0 905 608" width="905px" zoomAndPan="magnify"><title>Asignaci&#243;n estable propuesta (dise&#241;o elaborado a mano, no comportamiento del validador)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="609.8818" x="146.5081" y="30.7803">Asignaci&#243;n estable propuesta (dise&#241;o elaborado a mano, no comportamiento del validador)</text><ellipse cx="441.4785" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M604.7983,77 L604.7983,97.5 L584.7983,101.5 L604.7983,105.5 L604.7983,126 A0,0 0 0 0 604.7983,126 L893.8979,126 A0,0 0 0 0 893.8979,126 L893.8979,87 L883.8979,77 L604.7983,77 A0,0 0 0 0 604.7983,77 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M883.8979,77 L883.8979,87 L893.8979,87 L883.8979,77 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1626" x="610.7983" y="92.0103">Nunca se mueve.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.9053" x="610.7983" y="105.0103">Una solicitud para moverla</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.0996" x="610.7983" y="118.0103">se convierte en conflicto/propuesta de cambio.</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="286.6396" x="298.1587" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="266.6396" x="308.1587" y="105.0103">Conservar cada vinculaci&#243;n expl&#237;cita existente</text><polygon fill="#F1F1F1" points="32,212,266.1396,212,278.1396,224,266.1396,236,32,236,20,224,32,212" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="153.0698" y="246.0103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="234.1396" x="32" y="227.5103">&#191;Tipo de entrada / capacidad expl&#237;citos?</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.4624" x="39.3386" y="269"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.3315" x="49.3386" y="289.0103">Idoneidad desconocida:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.4624" x="49.3386" y="302.0103">detener la asignaci&#243;n para este rol</text><polygon fill="#F1F1F1" points="310.1396,211,506.7139,211,518.7139,224,506.7139,237,310.1396,237,298.1396,224,310.1396,211" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="412.4268" y="247.0103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="196.5742" x="310.1396" y="221.0103">&#191;Endpoint no usado con direcci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="310.1396" y="234.0103">y tipo sem&#225;ntico coincidentes?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="518.7139" y="221.0103">s&#237;</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="139.939" x="338.4573" y="270"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="116.3716" x="348.4573" y="290.0103">Capacidad agotada:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.939" x="348.4573" y="303.0103">informar del conflicto</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="324.2432" x="538.7139" y="250.75"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="150.3188" x="548.7139" y="270.7603">Compatible en capacidad:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="304.2432" x="548.7139" y="283.7603">elegir el primero por orden estable de ID de endpoint</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.2407" x="618.2151" y="331.75"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.918" x="628.2151" y="351.7603">Vinculaci&#243;n propuesta</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2407" x="628.2151" y="364.7603">(rol, endpoint, revisiones,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="121.4307" x="628.2151" y="377.7603">estado de idoneidad)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.0278" x="312.9646" y="146"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.9053" x="322.9646" y="166.0103">Siguiente rol sin vincular</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.0278" x="322.9646" y="179.0103">(orden can&#243;nico de nombre de rol l&#243;gico)</text><polygon fill="#F1F1F1" points="360.5491,430.75,522.408,430.75,534.408,442.75,522.408,454.75,360.5491,454.75,348.5491,442.75,360.5491,430.75" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.8589" x="360.5491" y="446.2603">&#191;Quedan roles sin vincular?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="534.408" y="439.7603">s&#237;</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="285.9351" x="298.511" y="496.7397"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="182.1016" x="308.511" y="516.75">Instalaci&#243;n confirmada solo con</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.9351" x="308.511" y="529.75">confirmaci&#243;n del responsable de la instalaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.0835" x="308.511" y="542.75">+ evidencia f&#237;sica</text><ellipse cx="441.4785" cy="586.7397" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="441.4785" cy="586.7397" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.4785" x2="441.4785" y1="65" y2="85"/><polygon fill="#181818" points="437.4785,75,441.4785,85,445.4785,75,441.4785,79" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="700.8354" x2="700.8354" y1="296.75" y2="331.75"/><polygon fill="#181818" points="696.8354,321.75,700.8354,331.75,704.8354,321.75,700.8354,325.75" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="149.0698" x2="149.0698" y1="236" y2="269"/><polygon fill="#181818" points="145.0698,259,149.0698,269,153.0698,259,149.0698,263" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="149.0698" x2="149.0698" y1="315" y2="410.75"/><polygon fill="#181818" points="145.0698,400.75,149.0698,410.75,153.0698,400.75,149.0698,404.75" style="stroke:#181818;