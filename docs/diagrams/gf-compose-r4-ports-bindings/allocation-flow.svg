xt><polygon fill="#F1F1F1" points="32,212,203.9834,212,215.9834,224,203.9834,236,32,236,20,224,32,212" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="121.9917" y="246.0103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.9834" x="32" y="227.5103">Input kind / capability explicit?</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.0234" x="32.48" y="269"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.6162" x="42.48" y="289.0103">Suitability-unknown:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.0234" x="42.48" y="302.0103">stop allocation for this role</text><polygon fill="#F1F1F1" points="247.9834,211,429.374,211,441.374,224,429.374,237,247.9834,237,235.9834,224,247.9834,211" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="342.6787" y="247.0103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.3906" x="247.9834" y="221.0103">Unused endpoint with matching</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="165.4834" x="247.9834" y="234.0103">direction and semantic type?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="441.374" y="221.0103">yes</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="136.3462" x="270.5056" y="270"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="116.3462" x="280.5056" y="290.0103">Exhausted capacity:</text><text fill="#000000" font-family="Helvetica"