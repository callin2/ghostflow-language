<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="332px" preserveAspectRatio="none" style="width:939px;height:332px;background:#FFFFFF;" version="1.1" viewBox="0 0 939 332" width="939px" zoomAndPan="magnify"><title>Un contexto de incidente, tres vistas (propuesta)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="324.3994" x="300.5514" y="20.7803">Un contexto de incidente, tres vistas (propuesta)</text><!--entity T--><g id="elem_T"><rect fill="#F1F1F1" height="137" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="302.1978" x="273.09" y="42"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.9561" x="283.09" y="62.0103">Tupla de contexto del incidente</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="283.09" y="75.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3989" x="283.09" y="88.0103">definici&#243;n / m&#243;dulo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="51.3081" x="283.09" y="101.0103">instancia</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="282.1978" x="283.09" y="114.0103">revisi&#243;n de ajustes + posici&#243;n efectiva del evento</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="136.5762" x="283.09" y="127.0103">instalaci&#243;n / vinculaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.9116" x="283.09" y="140.0103">ejecuci&#243;n / escaneo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="76.5972" x="283.09" y="153.0103">tiempo l&#243;gico</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.3389" x="283.09" y="166.0103">(+ enlaces a fuente / restricci&#243;n)</text></g><!--entity F--><g id="elem_F"><rect fill="#F1F1F1" height="46" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="192.3833" x="7" y="273.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="106.939" x="17" y="293.5103">Vista del agricultor</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="172.3833" x="17" y="306.5103">un bloqueo + siguiente acci&#243;n</text></g><!--entity S--><g id="elem_S"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="165.9707" x="234.21" y="267"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="99.7153" x="244.21" y="287.0103">Vista de software</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.9707" x="244.21" y="300.0103">salida solicitada / segura,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.1035" x="244.21" y="313.0103">fuente y restricci&#243;n</text></g><!--entity H--><g id="elem_H"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="194.8843" x="434.75" y="267"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.7808" x="444.75" y="287.0103">Vista de hardware</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2598" x="444.75" y="300.0103">vinculaci&#243;n, evento del driver,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.8843" x="444.75" y="313.0103">historial de arranque / eventos</text></g><!--entity R--><g id="elem_R"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="268.6123" x="664.89" y="267"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.6123" x="674.89" y="287.0103">Rechazado como obsoleto o no disponible:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="222.5869" x="674.89" y="300.0103">ejecuci&#243;n antigua, esquema / m&#243;dulo /</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.5615" x="674.89" y="313.0103">fuente incorrectos, vinculaci&#243;n incorrecta</text></g><!--link T to F--><g id="link_T_F"><path d="M305.58,179.49 C248.07,212.46 188.0554,246.8561 147.5654,270.0661 " fill="none" id="T-to-F" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="142.36,273.05,152.1574,272.0444,146.6978,270.5634,148.1789,265.1039,142.36,273.05" style="stroke:#181818;stroke-width:1.0;"/></g><!--link T to S--><g id="link_T_S"><path d="M384.65,179.49 C367.15,209.59 350.5144,238.1822 336.9644,261.5022 " fill="none" id="T-to-S" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="333.95,266.69,341.9301,260.9178,336.462,262.3668,335.013,256.8987,333.95,266.69" style="stroke:#181818;stroke-width:1.0;"/></g><!--link T to H--><g id="link_T_H"><path d="M464.1,179.49 C481.77,209.59 498.5641,238.1947 512.2441,261.5147 " fill="none" id="T-to-H" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="515.28,266.69,514.1763,256.9032,512.7501,262.3773,507.276,260.9511,515.28,266.69" style="stroke:#181818;stroke-width:1.0;"/></g><!--link T to R--><g id="link_T_R"><path d="M562.76,179.49 C624.1,209.59 687.5636,240.7267 735.0836,264.0467 " fill="none" id="T-to-R" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="740.47,266.69,734.1527,259.1341,735.9814,264.4872,730.6282,266.3159,740.47,266.69" style="stroke:#181818;strok