<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="319px" preserveAspectRatio="none" style="width:792px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 792 319" width="792px" zoomAndPan="magnify"><title>One incident context, three views (proposal)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="294.834" x="241.8615" y="20.7803">One incident context, three views (proposal)</text><!--entity T--><g id="elem_T"><rect fill="#F1F1F1" height="137" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="260.2715" x="247.31" y="42"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.8589" x="257.31" y="62.0103">Incident context tuple</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="257.31" y="75.0103">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.5107" x="257.31" y="88.0103">definition / module</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="48.4199" x="257.31" y="101.0103">instance</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="240.2715" x="257.31" y="114.0103">settings revision + effective event position</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.188" x="257.31" y="127.0103">installation / binding</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="57.0845" x="257.31" y="140.0103">run / scan</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="65.0254" x="257.31" y="153.0103">logical time</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.6953" x="257.31" y="166.0103">(+ source / constraint links)</text></g><!--entity F--><g id="elem_F"><rect fill="#F1F1F1" height="46" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="164.8979" x="7" y="260.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="71.5063" x="17" y="280.5103">Farmer view</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="144.8979" x="17" y="293.5103">one blocker + next action</text></g><!--entity S--><g id="elem_S"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="156.5952" x="207.15" y="254"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.9199" x="217.15" y="274.0103">Software view</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="136.5952" x="217.15" y="287.0103">requested / safe output,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="217.15" y="300.0103">source and constraint</text></g><!--entity H--><g id="elem_H"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="140.6816" x="399.11" y="254"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="85.9727" x="409.11" y="274.0103">Hardware view</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.6816" x="409.11" y="287.0103">binding, driver event,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.8398" x="409.11" y="300.0103">boot / event history</text></g><!--entity R--><g id="elem_R"><rect fill="#F1F1F1" height="59" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="212.207" x="574.35" y="254"/><text fill="#000000" font-family="Helvetica" font-size=