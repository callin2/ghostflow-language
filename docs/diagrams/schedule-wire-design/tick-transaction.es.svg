<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="571px" preserveAspectRatio="none" style="width:826px;height:571px;background:#FFFFFF;" version="1.1" viewBox="0 0 826 571" width="826px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=5a1c9018bf5443400408152d954bfee1dfcf7bcd2c7a984e19524aaa463781b4 plantuml=1.2024.7 --><defs/><g><ellipse cx="303.1619" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="316.6514" x="144.8362" y="50"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.1079" x="154.8362" y="70.0103">Recibir un ScheduleFacts inmutable</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="296.6514" x="154.8362" y="83.0103">(instant&#225;nea del reloj + un grupo por programaci&#243;n)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="337.2305" x="134.5466" y="116"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.5889" x="144.5466" y="136.0103">Preparar la compuerta de reloj</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="317.2305" x="144.5466" y="149.0103">(comprobaciones de brecha, confianza y recuperaci&#243;n)</text><path d="M501.2065,187 L501.2065,207.5 L481.2065,211.5 L501.2065,215.5 L501.2065,236 A0,0 0 0 0 501.2065,236 L814.1416,236 A0,0 0 0 0 814.1416,236 L814.1416,197 L804.1416,187 L501.2065,187 A0,0 0 0 0 501.2065,187 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M804.1416,187 L804.1416,197 L814.1416,197 L804.1416,187 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="182.1016" x="507.2065" y="202.0103">M&#225;s de una ocurrencia cruzada</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="220.3906" x="507.2065" y="215.0103">por primera vez en una programaci&#243;n:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="291.9351" x="507.2065" y="228.0103">registrar todas como omitidas, no ejecutar ninguna</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="356.0894" x="125.1172" y="182"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="336.0894" x="135.1172" y="202.0103">Para cada entrada del preludio, en orden de dependencia:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="235.5869" x="135.1172" y="215.0103">evaluar una vez contra el estado anterior</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="193.6606" x="135.1172" y="228.0103">y las proyecciones ya preparadas</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.876" x="169.2239" y="261"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.8906" x="179.2239" y="281.0103">Ejecutar transiciones e intenciones</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="247.876" x="179.2239" y="294.0103">(leen las entradas del preludio preparadas)</text><polygon fill="#F1F1F1" points="172.7175,327,433.6062,327,445.6062,339,433.6062,351,172.7175,351,160.7175,339,172.7175,327" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="260.8887" x="172.7175" y="342.5103">&#191;Tuvo &#233;xito toda expresi&#243;n que puede fallar?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="150.6057" y="336.0103">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="445.6062" y="336.0103">no</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.4351" x="11" y="361"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="259.4351" x="21" y="381.0103">Consolidar juntos: ventanas, estado del reloj,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="232.6797" x="21" y="394.0103">consumo de ocurrencias, observaciones</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="21" y="407.0103">de programaciones, estado escalar</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.7788" x="19.3281" y="455"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7788" x="29.3281" y="475.0103">TickRecord conserva hechos y decisiones</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.4834" x="356.3645" y="361"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="178.4834" x="366.3645" y="381.0103">Descartar todos los candidatos</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.3716" x="328.9204" y="429"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="233.3716" x="338.9204" y="449.0103">Un reintento posterior ve el mismo cruce</text><polygon fill="#F1F1F1" points="303.1619,494,315.1619,506,303.1619,518,291.1619,506,303.1619,494" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="303.1619" cy="549" fill="none" rx="11