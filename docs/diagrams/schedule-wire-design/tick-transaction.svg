<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="571px" preserveAspectRatio="none" style="width:639px;height:571px;background:#FFFFFF;" version="1.1" viewBox="0 0 639 571" width="639px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=0ea79398d0cfa76855d0623197bf73ef9f63c6f10c7587674b8bcd69e50b129a plantuml=1.2024.7 --><defs/><g><ellipse cx="262.6575" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.0669" x="129.624" y="50"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.4497" x="139.624" y="70.0103">Receive one immutable ScheduleFacts</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="246.0669" x="139.624" y="83.0103">(clock snapshot + one group per schedule)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.998" x="170.6584" y="116"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.1162" x="180.6584" y="136.0103">Stage clock gate</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.998" x="180.6584" y="149.0103">(gap, trust, recovery checks)</text><path d="M422.7368,187 L422.7368,207.5 L402.7368,211.5 L422.7368,215.5 L422.7368,236 A0,0 0 0 0 422.7368,236 L627.2793,236 A0,0 0 0 0 627.2793,236 L627.2793,197 L617.2793,187 L422.7368,187 A0,0 0 0 0 422.7368,187 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M617.2793,187 L617.2793,197 L627.2793,197 L617.2793,187 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.8125" x="428.7368" y="202.0103">More than one newly crossed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.1943" x="428.7368" y="215.0103">occurrence for a schedule:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="183.5425" x="428.7368" y="228.0103">record all missed, execute none</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.1587" x="122.5781" y="182"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="260.1587" x="132.5781" y="202.0103">For each prelude entry, in dependency order:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.2388" x="132.5781" y="215.0103">evaluate once against old state</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0615" x="132.5781" y="228.0103">and already staged projections</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.9307" x="169.1921" y="261"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.9243" x="179.1921" y="281.0103">Run transitions and intents</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="166.9307" x="179.1921" y="294.0103">(read staged prelude entries)</text><polygon fill="#F1F1F1" points="155.709,327,369.606,327,381.606,339,369.606,351,155.709,351,143.709,339,155.709,327" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="213.897" x="155.709" y="342.5103">Every fallible expression succeeded?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="123.479" y="336.0103">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="381.606" y="336.0103">no</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="245.418" x="11" y="361"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.418" x="21" y="381.0103">Commit together: windows, clock state,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.8906" x="21" y="394.0103">occurrence consumption, schedule</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.4053" x="21" y="407.0103">observations, scalar state</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="238.2134" x="14.6023" y="455"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2134" x="24.6023" y="475.0103">TickRecord keeps facts and decisions</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="159.458" x="311.877" y="361"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="139.458" x="321.877" y="381.0103">Discard every candidate</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="220.1353" x="281.5383" y="429"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.1353" x="291.5383" y="449.0103">Retry later sees the same crossing</text><polygon fill="#F1F1F1" points="262.6575,494,274.6575,506,262.6575,518,250.6575,506,262.6575,494" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="262.6575" cy="549" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="262.6575" cy="549" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#526D76;stroke-width:1.0;" x1="262.6575" x2="262.6575" y1="