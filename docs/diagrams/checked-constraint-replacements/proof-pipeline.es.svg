<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="642px" preserveAspectRatio="none" style="width:455px;height:642px;background:#FFFFFF;" version="1.1" viewBox="0 0 455 642" width="455px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=63c36789c271631d3d6873e6379281a70af2685a0056a1e73615f518c505f3eb plantuml=1.2024.7 --><title>Sustituci&#243;n comprobada de duplicados adyacentes</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="342.2959" x="55.1847" y="30.7803">Sustituci&#243;n comprobada de duplicados adyacentes</text><ellipse cx="233.5713" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="32" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="226.1094" x="120.5166" y="85"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="206.1094" x="130.5166" y="104.2402">Restricciones de salida Bool reducidas</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.0508" x="168.5459" y="185"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.0508" x="178.5459" y="204.2402">Conservar el original</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="102.0352" x="178.5459" y="216.2402">(complementos v1)</text><ellipse cx="233.5713" cy="263.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="233.5713" cy="263.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="126.8772,137,340.2654,137,352.2654,149,340.2654,161,126.8772,161,114.8772,149,126.8772,137" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="237.5713" y="169.4702">no</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="213.3882" x="126.8772" y="151.9702">&#191;La lista tiene como m&#225;ximo 128 entradas?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="8.5562" x="352.2654" y="146.4702">s&#237;</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.4863" x="80.8281" y="316.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="143.4316" x="90.8281" y="335.7402">Generaci&#243;n de candidatos:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="212.8008" x="90.8281" y="347.7402">fusionar duplicados exactos adyacentes</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="285.4863" x="90.8281" y="359.7402">(grupos dentro de 8 nombres &#250;nicos / 32 ocurrencias)</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.5273" x="86.8076" y="392.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="168.1113" x="96.8076" y="411.7402">Verificador finito independiente:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="273.5273" x="96.8076" y="423.7402">todas las instant&#225;neas Bool, conjuntos bloqueados,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.4453" x="96.8076" y="435.7402">cadenas de fallo, idempotencia</text><polygon fill="#F1F1F1" points="156.5364,469.5298,310.6062,469.5298,322.6062,481.5298,310.6062,493.5298,156.5364,493.5298,144.5364,481.5298,156.5364,469.5298" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="154.0698" x="156.5364" y="484.5">&#191;Transformado y comprobado?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="8.5562" x="135.9802" y="479">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="121.0591" x="322.6062" y="468">sin cambios, no admitido</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="100.8853" x="322.6062" y="479">o fallo del verificador</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.0781" x="11" y="503.5298"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="142.0547" x="21" y="522.77">Emitir artefacto optimizado</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="103.3887" x="21" y="534.77">con constraintProof</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="220.0781" x="21" y="546.77">(source-trace-v2 / source-observation-v2)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.0508" x="271.0781" y="503.5298"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.0508" x="281.0781" y="522.77">Conservar el original</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="102.0352" x="281.0781" y="534.77">(complementos v1)</text><polygon fill="#F1F1F1" points="233.5713,565.5298,245.5713,577.5298,233.5713,589.5298,221.5713,577.5298,233.5713,565.5298" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="233.5713" cy="620.5298" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="233.5713" cy="620.5298" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#5