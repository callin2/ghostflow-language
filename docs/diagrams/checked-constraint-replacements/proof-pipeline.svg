92" y="151.9702">List has at most 128 entries?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="310.5505" y="146.4702">yes</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.4707" x="88.4995" y="316.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="118.0898" x="98.4995" y="335.7402">Candidate generation:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="172.1016" x="98.4995" y="347.7402">merge adjacent exact duplicates</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="259.4707" x="98.4995" y="359.7402">(groups within 8 unique names / 32 occurrences)</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="194.0996" x="131.1851" y="392.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="144.0996" x="141.1851" y="411.7402">Independent finite checker:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="174.0996" x="141.1851" y="423.7402">all Bool snapshots, blocked sets,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="136.7402" x="141.1851" y="435.7402">fault strings, idempotence</text><polygon fill="#F1F1F1" points="161.2815,469.5298,295.1882,469.5298,307.1882,481.5298,295.1882,493.5298,161.2815,493.5298,149.2815,481.5298,161.2815,469.5298" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="133.9067" x="161.2815" y="484.5">Transformed and checked?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="132.1638" y="479">yes</text><text fill="#000000" font-family=