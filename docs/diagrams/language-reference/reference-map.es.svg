<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="366px" preserveAspectRatio="none" style="width:1221px;height:366px;background:#FFFFFF;" version="1.1" viewBox="0 0 1221 366" width="1221px" zoomAndPan="magnify"><defs/><g><!--entity SRC--><g id="elem_SRC"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="113.3789" x="7" y="7"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3789" x="17" y="27.7803">Fuente literaria</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.4756" x="17" y="41.7803">.ghost.md</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="17" y="55.7803">(Cap. 1)</text></g><!--entity COMP--><g id="elem_COMP"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="202.0889" x="197.72" y="7"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.0889" x="207.72" y="27.7803">Verificaciones del compilador</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4268" x="207.72" y="41.7803">tipos, unidades, nombres</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="99.5996" x="207.72" y="55.7803">(Cap. 2, Cap. 7)</text></g><!--entity TICK--><g id="elem_TICK"><rect fill="#F1F1F1" height="76" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="217.2988" x="618.14" y="146"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="94.1514" x="628.14" y="166.7803">C&#225;lculo del tick</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.8301" x="628.14" y="180.7803">entradas + estado anterior</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.2988" x="628.14" y="194.7803">-&gt; estado siguiente, intenciones</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="99.5996" x="628.14" y="208.7803">(Cap. 2, Cap. 3)</text></g><!--entity CONS--><g id="elem_CONS"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="219.2197" x="189.15" y="104"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="152.5029" x="199.15" y="124.7803">Sensores y restricciones</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2197" x="199.15" y="138.7803">calidad, enclavamientos, modos</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="199.15" y="152.7803">(Cap. 4)</text></g><!--entity OBS--><g id="elem_OBS"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="234.7646" x="181.38" y="201"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.1787" x="191.38" y="221.7803">Ajustes y observaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.7646" x="191.38" y="235.7803">cambios en vivo, eventos, alarmas</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="191.38" y="249.7803">(Cap. 5)</text></g><!--entity COMPOSE--><g id="elem_COMPOSE"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="196.6406" x="200.44" y="298"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="176.6406" x="210.44" y="318.7803">Composici&#243;n y reproducci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="137.7373" x="210.44" y="332.7803">import, binding, replay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="210.44" y="346.7803">(Cap. 6)</text></g><!--entity DEV--><g id="elem_DEV"><rect fill="#F1F1F1" height="62" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="197.3857" x="1018.44" y="153"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="177.3857" x="1028.44" y="173.7803">Runtime, Driver, dispositivos</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="171.2266" x="1028.44" y="187.7803">responsabilidades por capa</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="1028.44" y="201.7803">(Cap. 8)</text></g><!--link SRC to COMP--><g id="link_SRC_COMP"><path d="M120.81,38 C143.85,38 165.23,38 191.49,38 " fill="none" id="SRC-to-COMP" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="197.49,38,188.49,34,192.49,38,188.49,42,197.49,38" style="stroke:#555555;stroke-width:1.0;"/></g><!--link COMP to TICK--><g id="link_COMP_TICK"><path d="M400.04,60.03 C456.2,73.63 527.02,92.89 588.14,116 C610.33,124.39 628.3573,132.499 649.4373,142.979 " fill="none" id="COMP-to-TICK" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="654.81,145.65,648.5317,138.0617,650.3328,143.4241,644.9703,145.2252,654.81,145.65" style="stroke:#555555;stroke-width:1.0;"/></g><!--link CONS to TICK--><g id="link_CONS_TICK"><path d="M408.65,147.52 C472.87,154.91 547.8793,163.5341 611.9293,170.9041 " fill="none" id="CONS-to-TICK" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="617.89,171.59,609.4062,166.5874,612.9228,171.0184,608.4917,174.535,617.89,171.59" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="9