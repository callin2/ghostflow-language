<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="523px" preserveAspectRatio="none" style="width:588px;height:523px;background:#FFFFFF;" version="1.1" viewBox="0 0 588 523" width="588px" zoomAndPan="magnify"><defs/><g><ellipse cx="298.0527" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="341.9785" x="127.0635" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.9785" x="137.0635" y="71.6016">Evaluar el preludio una vez, en orden de dependencias,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.4766" x="137.0635" y="85.7344">contra el estado autorado anterior</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="308.5332" x="143.7861" y="118.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.5332" x="153.7861" y="139.8672">El consumidor W prepara la revisi&#243;n highwater de</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.1641" x="153.7861" y="154">CADA ventana aguas arriba declarada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.4258" x="153.7861" y="168.1328">(seleccionada o no, exitosa o no)</text><polygon fill="#F1F1F1" points="166.082,200.6641,430.0234,200.6641,442.0234,214.7969,430.0234,228.9297,166.082,228.9297,154.082,214.7969,166.082,200.6641" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.9414" x="166.082" y="212.2656">&#191;Resultado aguas arriba seleccionado exitoso</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.9355" x="166.082" y="226.3984">Y su revisi&#243;n &gt; highwater guardada?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="9.5859" x="144.4961" y="212.2656">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="14.8184" x="442.0234" y="212.2656">no</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.1641" x="11" y="238.9297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.1641" x="21" y="260.5313">Admitir UNA identidad de evento derivado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.8887" x="21" y="274.6641">(site, admissionRevision)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.8965" x="21" y="288.7969">+ &#225;rbol de prueba propio</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.8438" x="326.1016" y="238.9297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.9434" x="336.1016" y="260.5313">Ning&#250;n punto nuevo aguas abajo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.8438" x="336.1016" y="274.6641">(vencimiento, reselecci&#243;n, reevaluaci&#243;n)</text><polygon fill="#F1F1F1" points="298.0527,307.3281,310.0527,319.3281,298.0527,331.3281,286.0527,319.3281,298.0527,307.3281" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="212.7637,358.625,383.3418,358.625,395.3418,370.625,383.3418,382.625,212.7637,382.625,200.7637,370.625,212.7637,358.625" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" text