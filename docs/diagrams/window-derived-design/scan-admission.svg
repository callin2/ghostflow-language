<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="523px" preserveAspectRatio="none" style="width:492px;height:523px;background:#FFFFFF;" version="1.1" viewBox="0 0 492 523" width="492px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=be883d91f3361a7d56b7d5a755e63ffb8b8bd874d9aed7b145616b08bd6501a9 plantuml=1.2024.7 --><defs/><g><ellipse cx="247.1563" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278.9609" x="107.6758" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.9609" x="117.6758" y="71.6016">Evaluate prelude once, in dependency order,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.9766" x="117.6758" y="85.7344">against old authored state</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.5176" x="116.3975" y="118.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.5176" x="126.3975" y="139.8672">Consumer W stages highwater revision of</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.3008" x="126.3975" y="154">EVERY declared upstream window</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.6973" x="126.3975" y="168.1328">(selected or not, successful or not)</text><polygon fill="#F1F1F1" points="141.9219,200.6641,352.3906,200.6641,364.3906,214.7969,352.3906,228.9297,141.9219,228.9297,129.9219,214.7969,141.9219,200.6641" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.8203" x="141.9219" y="212.2656">Selected upstream result successful</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.4688" x="141.9219" y="226.3984">AND its revision &gt; saved highwater?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="19.0723" x="110.8496" y="212.2656">yes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="14.8184" x="364.3906" y="212.2656">no</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.5547" x="14.1445" y="238.9297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.6582" x="24.1445" y="260.5313">Admit ONE derived event</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.5547" x="24.1445" y="274.6641">identity (site, admissionRevision)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.6191" x="24.1445" y="288.7969">+ owned proof tree</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.1504" x="267.3154" y="238.9297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.9824" x="277.3154" y="260.5313">No new downstream point</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.1504" x="277.3154" y="274.6641">(expiry, reselection, reevaluation)</text><polygon fill="#F1F1F1" points="247.1563,307.3281,259.1563,319.3281,247.1563,331.3281,235.1563,319.3281,247.1563,307.3281" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="183.5908,358.625,310.7217,358.625,322.7217,370.625,310.7217,382.625,183.5908,382.625,171.5908,370.625,183.5908,358.625" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.1309" x="183.5908" y="375.1602">Whole scan succeeds?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="19.0723" x="152.5186" y="368.0938">yes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.5098" x="322.7217" y="353.9609">no: source, density,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.418" x="322.7217" y="368.0938">arithmetic or intent error</text><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="237.125" x="11" y="392.625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.125" x="21" y="414.2266">Commit windows, proofs, highwaters</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.25" x="268.125" y="392.625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.7227" x="278.125" y="414.2266">Roll back everything;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.25" x="278.125" y="428.3594">retry sees the same freshness</text><polygon fill="#F1F1F1" points="247.1563,446.8906,259.1563,458.8906,247.1563,470.8906,235.1563,458.8906,247.1563,446.8906" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="247.1563" cy="501.8906" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="247.1563" cy="501.8906" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.1563" x2="247.1563" y1="30" y2="50"/><polygon fill="#181818" points="243.1563,40,247.1563,50,251.1563,40,247.1563,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.1563"