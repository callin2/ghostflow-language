<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="730px" preserveAspectRatio="none" style="width:280px;height:730px;background:#FFFFFF;" version="1.1" viewBox="0 0 280 730" width="280px" zoomAndPan="magnify"><defs/><g><ellipse cx="140.0654" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="34.1328" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="175.0859" x="52.5225" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.0859" x="62.5225" y="71.6016">Input snapshot + old state</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="201.8926" x="39.1191" y="153.1992"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="69.4453" x="49.1191" y="174.8008">Reject input</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.8926" x="49.1191" y="188.9336">(if absence matters, host sends</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.4316" x="49.1191" y="203.0664">an explicit fault/status input)</text><ellipse cx="140.0654" cy="246.5977" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="140.0654" cy="246.5977" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="85.7109,104.1328,194.4199,104.1328,206.4199,116.1328,194.4199,128.1328,85.7109,128.1328,73.7109,116.1328,85.7109,104.1328" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="19.0723" x="144.0654" y="139.7344">yes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.709" x="85.7109" y="120.668">any input missing?</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.8262" x="45.6523" y="299.5977"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.8262" x="55.6523" y="321.1992">Evaluate all next expressions</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.627" x="55.6523" y="335.332">(read old state + inputs)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.3789" x="55.6523" y="349.4648">-&gt; one candidate state</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="161.3926" x="59.3691" y="381.9961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.998" x="69.3691" y="403.5977">Evaluate intents</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.6953" x="69.3691" y="417.7305">(unprimed state = old;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.3926" x="69.3691" y="431.8633">next.NAME = candidate)</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.9824" x="55.0742" y="464.3945"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.3711" x="65.0742" y="485.9961">Safety constraints</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.3594" x="65.0742" y="500.1289">(requires, mutex)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.9824" x="65.0742" y="514.2617">requested -&gt; safe intents</text><rect fill="#F1F1F1" height="62.3984" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.1309" x="11" y="546.793"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.2559" x="21" y="568.3945">No evaluation error:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97.2363" x="21" y="582.5273">commit together</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.1309" x="21" y="596.6602">candidate state + requested/safe intents</text><rect fill="#F1F1F1" height="48.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="196.7773" x="41.6768" y="629.1914"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.7773" x="51.6768" y="650.793">Journal: inputs, old/new state,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.6152" x="51.6768" y="664.9258">both intents, strategy, faults</text><ellipse cx="140.0654" cy="708.457" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="140.0654" cy="708.457" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="140.0654" x2="140.0654" y1="30" y2="50"/><polygon fill="#181818" points="136.0654,40,140.0654,50,144.0654,40,140.0654,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="140.0654" x2="140.0654" y1="215.5977" y2="235.5977"/><polygon fill="#181818" points="136.0654,225.5977,140.0654,235.5977,144.0654,225.5977,140.0654,229.5977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="140.0654" x2="140.0654" y1="128.1328" y2="153.1992"/><polygon fill="#181818" points="136.0654,143.1992,140.0654,153.1992,144.0654,143.1992,140.0654,147.1992" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="206.4199" x2="251.0117" y1="116.1328" y2