<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="427px" preserveAspectRatio="none" style="width:250px;height:427px;background:#FFFFFF;" version="1.1" viewBox="0 0 250 427" width="250px" zoomAndPan="magnify"><defs/><g><ellipse cx="125.0479" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.7285" x="25.6836" y="50"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="168.7559" x="35.6836" y="69.2402">1. Establish the working context</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="178.7285" x="35.6836" y="81.2402">(start from dev, record base SHA,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="155.3906" x="35.6836" y="93.2402">read AGENTS.md, docs:find)</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.4297" x="15.333" y="126"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="126.0703" x="25.333" y="145.2402">2. Set one task contract</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="199.4297" x="25.333" y="157.2402">(outcome, scope, acceptance criteria,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="156.0762" x="25.333" y="169.2402">prerequisites, focused check)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.8145" x="12.6406" y="202"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="204.8145" x="22.6406" y="221.2402">3. Assign a complete bounded handoff</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.7129" x="22.6406" y="233.2402">(one worker per unit)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.1035" x="29.9961" y="266"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="170.1035" x="39.9961" y="285.2402">4. Verify once, at the right depth</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="144.0469" x="39.9961" y="297.2402">(static -&gt; focused -&gt; full CI)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.0957" x="11" y="330"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="89.3789" x="21" y="349.2402">5. Close the task</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="208.0957" x="21" y="361.2402">(report evidence, improve repeatability)</text><ellipse cx="125.0479" cy="405" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="125.0479" cy="405" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="30" y2="50"/><polygon fill="#181818" points="121.0479,40,125.0479,50,129.0479,40,125.0479,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="106" y2="126"/><polygon fill="#181818" points="121.0479,116,125.0479,126,129.0479,116,125.0479,120" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="182" y2="202"/><polygon fill="#181818" points="121.0479,192,125.0479,202,129.0479,192,125.0479,196" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="246" y2="266"/><polygon fill="#181818" points="121.0479,256,125.0479,266,129.0479,256,125.0479,260" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="310" y2="330"/><polygon fill="#181818" points="121.0479,320,125.0479,330,129.0479,320,125.0479,324" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.0479" x2="125.0479" y1="374" y2="394"/><polygon fill="#181818" points="121.0479,384,125.0479,394,129.0479,384,125.0479,388" style="stroke:#181818;stroke-width:1.0;"/><!--SRC=[FP0_QmCn3CNtV0gDBLmF-cz9eH12sdJ9aj8fYsBBENC-oxLrb-RRLxv01cDXw_sUz4hlOyAC0vGEBPzzF873K6XHRZ-M78v1FZZA3WU2BOM9n1jS5C4iY-LZ2nijZy6N3gGZE7FkAyceXFxa4E_cJd2PAsvg89FXRE68XM2_NJM7c0ajh3utk-zzEzW6B9koT3xQ-xV5ygc5FGbm910i_GpEQ2gPHp4yK0F5SD8BZQ4a60s1oLueUrHwofJfT_H5Nqe3ZirOo8BfoFJLuBc5LId-504LFgH0Gd3aCLhjwZ1QTgwQnUjob27f6QENgdvfuKUDt4KdD7K6cMF8_jI9xfkakqQWeS73-yszbcC8iFwgaDSMre4rZogjMwecKsBDZIPlQIRx8MMU54s9K2FtmSj5rKKu_GC0]--></g></svg>