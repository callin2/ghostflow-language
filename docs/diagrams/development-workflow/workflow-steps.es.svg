<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="427px" preserveAspectRatio="none" style="width:306px;height:427px;background:#FFFFFF;" version="1.1" viewBox="0 0 306 427" width="306px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=cdb4fb8e9b6a8c4aa244a574235399abc1942f3b2863d152af6605610956ec1d plantuml=1.2024.7 --><defs/><g><ellipse cx="153.0879" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.748" x="45.7139" y="50"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="188.1152" x="55.7139" y="69.2402">1. Establecer el contexto de trabajo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="194.748" x="55.7139" y="81.2402">(partir de dev, registrar el SHA base,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="151.3828" x="55.7139" y="93.2402">leer AGENTS.md, docs:find)</text><rect fill="#F1F1F1" height="56" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.7832" x="24.6963" y="126"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="179.4375" x="34.6963" y="145.2402">2. Fijar un &#250;nico contrato de tarea</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="231.457" x="34.6963" y="157.2402">(resultado, alcance, criterios de aceptaci&#243;n,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="236.7832" x="34.6963" y="169.2402">requisitos previos, comprobaci&#243;n focalizada)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="248.8145" x="28.6807" y="202"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="228.8145" x="38.6807" y="221.2402">3. Asignar una entrega completa y acotada</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="138.7559" x="38.6807" y="233.2402">(un trabajador por unidad)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="284.1758" x="11" y="266"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="264.1758" x="21" y="285.2402">4. Verificar una vez, con la profundidad adecuada</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="202.752" x="21" y="297.2402">(est&#225;tica -&gt; focalizada -&gt; CI completa)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.4551" x="11.3604" y="330"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="90.7031" x="21.3604" y="349.2402">5. Cerrar la tarea</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="263.4551" x="21.3604" y="361.2402">(informar de la evidencia, mejorar la repetibilidad)</text><ellipse cx="153.0879" cy="405" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="153.0879" cy="405" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.0879" x2="153.0879" y1="30" y2="50"/><polygon fill="#181818" points="149.0879,40,153.0879,50,157.0879,40,153.0879,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.0879" x2="153.0879" y1="106" y2="126"/><polygon fill="#181818" points="149.0879,116,153.0879,126,157.0879,116,153.0879,120" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="153.0879" x2="153.0879" y1="182" y2="20