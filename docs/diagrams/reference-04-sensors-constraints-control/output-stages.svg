="157">and quality. Evidence at one stage</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.897" x="686.19" y="170">does not prove the next stage.</text></g><!--link IN to REQ--><g id="link_IN_REQ"><path d="M114.55,69.4897 C157.41,69.4897 210.86,69.4897 249.94,69.4897 " fill="none" id="IN-to-REQ" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="255.94,69.4897,246.94,65.4897,250.94,69.4897,246.94,73.4897,255.94,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.5771" x="145.16" y="65.5">output &lt;- expr</text></g><!--link REQ to ARB--><g id="link_REQ_ARB"><path d="M338.89,69.4897 C357.46,69.4897 373.62,69.4897 393.13,69.4897 " fill="none" id="REQ-to-ARB" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="399.13,69.4897,390.13,65.4897,394.13,69.4897,390.13,73.4897,399.13,69.4897" style="stroke:#181818;stroke-width:1.0;"/></g><!--link ARB to SAFE--><g id="link_ARB_SAFE"><path d="M499.67,69.4897 C562.94,69.4897 666.25,69.4897 731.87,69.4897 " fill="none" id="ARB-to-SAFE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="737.87,69.4897,728.87,65.4897,732.87,69.4897,728.87,73.4897,737.87,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.9517" x="530.19" y="52.5">Bool constraints only</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="95.0181" x="542.6568" y="65.5">turn true -&gt; false</text></g><!--link SAFE to APP--><g id="link_SAFE_APP"><path d="M848.9,69.4897 C900.09,69.4897 970.54,69.4897 1023.99,69.4897 " fill="none" id="SAFE-to-APP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1029.99,69.4897,1020.99,65.4897,1024.99,69.4897,1020.99,73.4897,1029.99,69.4897" style="stro