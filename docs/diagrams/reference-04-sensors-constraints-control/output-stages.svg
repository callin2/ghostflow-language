<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="184px" preserveAspectRatio="none" style="width:1429px;height:184px;background:#FFFFFF;" version="1.1" viewBox="0 0 1429 184" width="1429px" zoomAndPan="magnify"><title>From inputs to confirmed state</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="206.124" x="604.7503" y="20.7803">From inputs to confirmed state</text><!--entity IN--><g id="elem_IN"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="107.1582" x="7" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="49.4238" x="17" y="66.27">inputs +</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="87.1582" x="17" y="80.27">previous state</text></g><!--entity REQ--><g id="elem_REQ"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="82.2686" x="256.16" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2686" x="266.16" y="66.27">requested</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="34.248" x="266.16" y="80.27">intent</text></g><!--entity ARB--><g id="elem_ARB"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="99.7617" x="399.43" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2549" x="409.43" y="66.27">arbitration</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="79.7617" x="409.43" y="80.27">+ constraints</text></g><!--entity SAFE--><g id="elem_SAFE"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" widt