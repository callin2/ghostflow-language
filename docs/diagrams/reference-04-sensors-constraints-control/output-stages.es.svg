<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="184px" preserveAspectRatio="none" style="width:1748px;height:184px;background:#FFFFFF;" version="1.1" viewBox="0 0 1748 184" width="1748px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=e72b0d19a4f04b0e5a3b2b345d59626ac6b02cde474445c8e56b31c772e7c56e plantuml=1.2024.7 --><title>De las entradas al estado confirmado</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="248.1924" x="743.0176" y="20.7803">De las entradas al estado confirmado</text><!--entity IN--><g id="elem_IN"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="113.3926" x="7" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.5479" x="17" y="66.27">entradas +</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3926" x="17" y="80.27">estado anterior</text></g><!--entity REQ--><g id="elem_REQ"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="153.8477" x="262.39" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="56.041" x="272.39" y="66.27">intenci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.8477" x="272.39" y="80.27">solicitada (requested)</text></g><!--entity ARB--><g id="elem_ARB"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="110.6445" x="477.24" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="50.5791" x="487.24" y="66.27">arbitraje</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="90.6445" x="487.24" y="80.27">+ restricciones</text></g><!--entity SAFE--><g id="elem_SAFE"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="130.5166" x="860.4" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.5166" x="870.4" y="66.27">intenci&#243;n segura /</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="87.9238" x="870.4" y="80.27">efectiva (safe)</text></g><!--entity APP--><g id="elem_APP"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="167.8545" x="1188.44" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.5166" x="1198.44" y="66.27">aplicado (applied)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.8545" x="1198.44" y="80.27">(renderizador de salida)</text></g><!--entity CONF--><g id="elem_CONF"><rect fill="#F7F9FC" height="48" rx="2.5" ry="2.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="163.9375" x="1578.29" y="45.4897"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.9375" x="1588.29" y="66.27">confirmado (confirmed)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.71" x="1588.29" y="80.27">(retroalimentaci&#243;n)</text></g><g id="elem_GMN13"><path d="M799.88,128.9897 L799.88,177.9897 A0,0 0 0 0 799.88,177.9897 L1051.4332,177.9897 A0,0 0 0 0 1051.4332,177.9897 L1051.4332,138.9897 L1041.4332,128.9897 L929.66,128.9897 L925.66,93.9497 L921.66,128.9897 L799.88,128.9897 A0,0 0 0 0 799.88,128.9897 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1041.4332,128.9897 L1041.4332,138.9897 L1051.4332,138.9897 L1041.4332,128.9897 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="230.5532" x="805.88" y="144">Cada etapa tiene su propia procedencia</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.0469" x="805.88" y="157">y calidad. La evidencia de una etapa</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="188.627" x="805.88" y="170">no demuestra la etapa siguiente.</text></g><!--link IN to REQ--><g id="link_IN_REQ"><path d="M120.73,69.4897 C161.54,69.4897 211.28,69.4897 256.13,69.4897 " fill="none" id="IN-to-REQ" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="262.13,69.4897,253.13,65.4897,257.13,69.4897,253.13,73.4897,262.13,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.5771" x="151.39" y="65.5">output &lt;- expr</text></g><!--link REQ to ARB--><g id="link_REQ_ARB"><path d="M416.73,69.4897 C436.81,69.4897 452.07,69.4897 470.76,69.4897 " fill="none" id="REQ-to-ARB" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="476.76,69.4897,467.76,65.4897,471.76,69.4897,467.76,73.4897,476.76,69.4897" style="stroke:#181818;stroke-width:1.0;"/></g><!--link ARB to SAFE--><g id="link_ARB_SAFE"><path d="M588.35,69.4897 C659.73,69.4897 778.32,69.4897 854.17,69.4897 " fill="none" id="ARB-to-SAFE" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="860.17,69.4897,851.17,65.4897,855.17,69.4897,851.17,73.4897,860.17,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="150.2871" x="618.88" y="52.5">las restricciones Bool solo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="132.5962" x="627.7255" y="65.5">convierten true -&gt; false</text></g><!--link SAFE to APP--><g id="link_SAFE_APP"><path d="M991.09,69.4897 C1046.73,69.4897 1121.46,69.4897 1182.01,69.4897 " fill="none" id="SAFE-to-APP" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1188.01,69.4897,1179.01,65.4897,1183.01,69.4897,1179.01,73.4897,1188.01,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.8862" x="1082.44" y="52.5">aplicaci&#243;n en</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="74.4263" x="1083.17" y="65.5">el dispositivo</text></g><!--link APP to CONF--><g id="link_APP_CONF"><path d="M1356.62,69.4897 C1422.1,69.4897 1506.8,69.4897 1571.81,69.4897 " fill="none" id="APP-to-CONF" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1577.81,69.4897,1568.81,65.4897,1572.81,69.4897,1568.81,73.4897,1577.81,69.4897" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="160.4116" x="1387.29" y="52.5">codificador, final de carrera,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="51.2954" x="1441.8481" y="65.5">visi&#243;n, ...</text></g></g></svg>