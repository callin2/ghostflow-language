" lengthAdjust="spacing" textLength="17.1177" x="343.9346" y="181.4702">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="142.4468" x="268.7112" y="163.9702">Driver reports Disconnected?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="423.158" y="158.4702">no</text><polygon fill="#F7F9FC" points="285.2166,328.5,394.6526,328.5,406.6526,340.5,394.6526,352.5,285.2166,352.5,273.2166,340.5,285.2166,328.5" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="109.436" x="285.2166" y="343.4702">New physical sample?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="120.4521" x="152.7644" y="337.9702">no: duplicate / clock-only</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="406.6526" y="337.9702">yes</text><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="193.4023" x="92.0525" y="362.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="173.4023" x="102.0525" y="381.7402">No filter or recovery contribution;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="126.0703" x="102.0525" y="393.7402">freshness not refreshed</text><polygon fill="#F7F9FC" points="403.9802,362.5,578.2507,362.5,590.2507,374.5,578.2507,386.5,403.9802,386.5,391.9802,374.5,403.9802,362.5" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="174.2705" x="403.9802" y="377.4702">Payload, unit and `valid` range OK?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="379.7449" y="371.9702">no</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="590.2507" y="371.9702">yes</text><rect fill="#FFE5E5" height="32" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="133.0508" x="315.4548" y="396.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="113.0508" x="325.4548" y="415.7402">Result = fault(Invalid)</text><ellipse cx="381.9802" cy="459.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="381.9802" cy="459.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="32" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="114.0488" x="543.2263" y="396.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="94.0488" x="553.2263" y="415.7402">Update filter state</text><polygon fill="#F7F9FC" points="339.9346,480.5,351.9346,492.5,339.9346,504.5,327.9346,492.5,339.9346,480.5" style="stroke:#4A6FA5;stroke-width:0.5;"/><path d="M10,514.5 L10,550.5 L238.3716,550.5 L238.3716,524.5 L228.3716,514.5 L10,514.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M228.3716,514.5 L228.3716,524.5 L238.3716,524.5 L228.3716,514.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="189.3062" x="16" y="529.5103">Any fault clears the filter window;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="207.3716" x="16" y="542.5103">recovery needs fresh valid samples.</text><rect fill="#FFF4D6" height="32" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="151.7246" x="264.0723" y="598.5"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="131.7246" x="274.0723" y="617.7402">Result = fault(NotReady)</text><ellipse cx="339.9