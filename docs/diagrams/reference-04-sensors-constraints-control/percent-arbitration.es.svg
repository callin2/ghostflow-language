<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="438px" preserveAspectRatio="none" style="width:572px;height:438px;background:#FFFFFF;" version="1.1" viewBox="0 0 572 438" width="572px" zoomAndPan="magnify"><title>Pol&#237;tica de recurso Percent continuo (ejemplo P)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="322.8477" x="123.3701" y="30.7803">Pol&#237;tica de recurso Percent continuo (ejemplo P)</text><ellipse cx="292.0552" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="293.1992" x="145.4556" y="85"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="199.4355" x="155.4556" y="104.2402">Evaluar todas las solicitudes y techos</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="273.1992" x="155.4556" y="116.2402">sobre una instant&#225;nea de entrada + estado anterior</text><polygon fill="#F7F9FC" points="208.2795,149,375.8308,149,387.8308,161,375.8308,173,208.2795,173,196.2795,161,208.2795,149" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="167.5513" x="208.2795" y="163.9702">&#191;Alguna solicitud o techo en fallo?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="8.5562" x="187.7234" y="158.4702">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="387.8308" y="158.4702">no</text><rect fill="#FFF4D6" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="276.8164" x="11" y="183"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="181.7695" x="21" y="202.2402">candidato = `safe` redactado (0%)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.8164" x="21" y="214.2402">(`on_unknown = safe`; conditionsKnown = false)</text><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="253.7715" x="307.8164" y="183"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="233.7715" x="317.8164" y="202.2402">candidato = `select` (max) de las solicitudes</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="217.7988" x="317.8164" y="214.2402">temperatura 70%, humedad 40% -&gt; 70%</text><polygon fill="#F7F9FC" points="292.0552,233,304.0552,245,292.0552,257,280.0552,245,292.0552,233" style="stroke:#4A6FA5;stroke-width:0.5;"/><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="205.4199" x="189.3452" y="277"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="185.4199" x="199.3452" y="296.2402">Recortar al techo conocido m&#237;nimo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="67.3652" x="199.3452" y="308.2402">(viento 20%)</text><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="214.1328" x="184.9888" y="341"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="194.1328" x="194.9888" y="360.2402">Intenci&#243;n segura final de vent_target</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="188.4375" x="194.9888" y="372.2402">sin fallo: 70% -&gt; 20%; con fallo: 0%</text><ellipse cx="292.0552" cy="416" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="292.0552" cy="416" fill="#222222" rx="6"