<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="438px" preserveAspectRatio="none" style="width:551px;height:438px;background:#FFFFFF;" version="1.1" viewBox="0 0 551 438" width="551px" zoomAndPan="magnify"><title>Continuous Percent resource policy (example P)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="322.8613" x="112.6992" y="30.7803">Continuous Percent resource policy (example P)</text><ellipse cx="286.7231" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="226.4785" x="173.4839" y="85"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="178.1074" x="183.4839" y="104.2402">Evaluate all requests and ceilings</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="206.4785" x="183.4839" y="116.2402">on one input snapshot + previous state</text><polygon fill="#F7F9FC" points="212.7336,149,360.7126,149,372.7126,161,360.7126,173,212.7336,173,200.7336,161,212.7336,149" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="147.979" x="212.7336" y="163.9702">Any request or ceiling faulted?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="183.616" y="158.4702">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="372.7126" y="158.4702">no</text><rect fill="#FFF4D6" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="276.8164" x="11" y="183"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="175.7695" x="21" y="202.2402">candidate = authored `safe` (0%)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.8164" x="21" y="214.2402">(`on_unknown = safe`; conditionsKnown = false)</text><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="232.4434" x="307.8164" y="183"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="201.7559" x="317.8164" y="202.2402">candidate = `select` (max) of requests</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="212.4434" x="317.8164" y="214.2402">temperature 70%, humidity 40% -&gt; 70%</text><polygon fill="#F7F9FC" points="286.7231,233,298.7231,245,286.7231,257,274.7231,245,286.7231,233" style="stroke:#4A6FA5;stroke-width:0.5;"/><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="195.3945" x="189.0259" y="277"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="175.3945" x="199.0259" y="296.2402">Clamp to minimum known ceiling</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="60.0234" x="199.0259" y="308.2402">(wind 20%)</text><rect fill="#F7F9FC" height="44" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="185.4277" x="194.0093" y="341"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.4277" x="204.0093" y="360.2402">Final safe intent for vent_target</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.0996" x="204.0093" y="372.2402">no fault: 70% -&gt; 20%; fault: 0%</text><ellipse cx="286.7231" cy="416" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="286.7231" cy="416" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;st