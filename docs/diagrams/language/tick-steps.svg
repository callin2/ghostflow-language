<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="589px" preserveAspectRatio="none" style="width:309px;height:589px;background:#FFFFFF;" version="1.1" viewBox="0 0 309 589" width="309px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=c449dcda1adddc674e0b176c304c70b17165466bc60bd198b3839024c49f51e6 plantuml=1.2024.7 --><defs/><g><ellipse cx="144.8882" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="204.0781" x="42.8491" y="50"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="184.0781" x="52.8491" y="69.2402">1. Freeze strategy, profile revision,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="107.4082" x="52.8491" y="81.2402">inputs, and old state</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="204.7637" x="42.5063" y="114"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="184.7637" x="52.5063" y="133.2402">2. Compute let/with and every next</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.082" x="52.5063" y="145.2402">(reads old state + same inputs)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="196.7773" x="46.4995" y="178"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="176.7773" x="56.4995" y="197.2402">3. Build complete candidate state</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.4316" x="56.4995" y="209.2402">(no transition = keep old value)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="178.7656" x="55.5054" y="242"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="120.7266" x="65.5054" y="261.2402">4. Compute intent/emit</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.7656" x="65.5054" y="273.2402">(state = old, next = candidate)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="160.0684" x="64.854" y="306"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="140.0684" x="74.854" y="325.2402">5. Apply safety constraints</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="134.4082" x="74.854" y="337.2402">(requested -&gt; safe intent)</text><polygon fill="#F1F1F1" points="118.9028,370,170.8735,370,182.8735,382,170.8735,394,118.9028,394,106.9028,382,118.9028,370" style="stroke:#555555;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="51.9707" x="118.9028" y="384.9702">tick failed?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="89.7852" y="379.4702">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="182.8735" y="379.4702">no</text><rect fill="#F1F1F1" height="32" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="104.0352" x="16.0098" y="404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="84.0352" x="26.0098" y="423.2402">Commit nothing</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="114.0547" x="11" y="468"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="81.3691" x="21" y="487.2402">Host applies its</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="94.0547" x="21" y="499.2402">safe-output policy</text><ellipse cx="68.0273" cy="555" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="68.0273" cy="555" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="153.3887" x="145.0547" y="404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="133.3887" x="155.0547" y="423.2402">6. Commit state, outputs,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.7363" x="155.0547" y="435.2402">and records together</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="144.7402" x="149.3789" y="480"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="124.7402" x="159.3789" y="499.2402">7. Real host only: apply</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="117.4043" x="159.3789" y="511.2402">safe intent to renderer</text><ellipse cx="221.749" cy="567" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="221.749" cy="567" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="30" y2="50"/><polygon fill="#555555" points="140.8882,40,144.8882,50,148.8882,40,144.8882,44" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="94" y2="114"/><polygon fill="#555555" points="140.8882,104,144.8882,114,148.8882,104,144.8882,108" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="158" y2="178"/><polygon fill="#555555" points="140.8882,168,144.8882,178,148.8882,168,144.8882,172" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="222" y2="242"/><polygon fill="#555555" points="140.8882,232,144.8882,242,148.8882,232,144.8882,236" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="286" y2="306"/><polygon fill="#555555" points="140.8882,296,144.8882,306,148.8882,296,144.8882,300" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="68.0273" x2="68.0273" y1="436" y2="468"/><polygon fill="#555555" points="64.0273,458,68.0273,468,72.0273,458,68.0273,462" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="68.0273" x2="68.0273" y1="512" y2="544"/><polygon fill="#555555" points="64.0273,534,68.0273,544,72.0273,534,68.0273,538" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="221.749" x2="221.749" y1="448" y2="480"/><polygon fill="#555555" points="217.749,470,221.749,480,225.749,470,221.749,474" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="221.749" x2="221.749" y1="524" y2="556"/><polygon fill="#555555" points="217.749,546,221.749,556,225.749,546,221.749,550" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="106.9028" x2="68.0273" y1="382" y2="382"/><line style="stroke:#555555;stroke-width:1.0;" x1="68.0273" x2="68.0273" y1="382" y2="404"/><polygon fill="#555555" points="64.0273,394,68.0273,404,72.0273,394,68.0273,398" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="182.8735" x2="221.749" y1="382" y2="382"/><line style="stroke:#555555;stroke-width:1.0;" x1="221.749" x2="221.749" y1="382" y2="404"/><polygon fill="#555555" points="217.749,394,221.749,404,225.749,394,221.749,398" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="144.8882" x2="144.8882" y1="350" y2="370"/><polygon fill="#555555" points="140.8882,360,144.8882,370,148.8882,360,144.8882,364" style="stroke:#555555;stroke-width:1.0;"/></g></svg>