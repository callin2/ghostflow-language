<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="589px" preserveAspectRatio="none" style="width:382px;height:589px;background:#FFFFFF;" version="1.1" viewBox="0 0 382 589" width="382px" zoomAndPan="magnify"><defs/><g><ellipse cx="180.9219" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="238.1152" x="61.8643" y="50"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="218.1152" x="71.8643" y="69.2402">1. Congelar estrategia, revisi&#243;n del perfil,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="139.418" x="71.8643" y="81.2402">entradas y estado anterior</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="232.4316" x="64.7061" y="114"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="162.7441" x="74.7061" y="133.2402">2. Calcular let/with y cada next</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="212.4316" x="74.7061" y="145.2402">(lee estado anterior + mismas entradas)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="241.4609" x="60.1914" y="178"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="221.4609" x="70.1914" y="197.2402">3. Construir el estado candidato completo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="217.752" x="70.1914" y="209.2402">(sin transici&#243;n = conservar valor anterior)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="203.4395" x="79.2021" y="242"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="116.0508" x="89.2021" y="261.2402">4. Calcular intent/emit</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="183.4395" x="89.2021" y="273.2402">(state = anterior, next = candidato)</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="213.4297" x="74.207" y="306"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="193.4297" x="84.207" y="325.2402">5. Aplicar restricciones de seguridad</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="163.752" x="84.207" y="337.2402">(intenci&#243;n solicitada -&gt; segura)</text><polygon fill="#F1F1F1" points="148.8269,370,213.0168,370,225.0168,382,213.0168,394,148.8269,394,136.8269,382,148.8269,370" style="stroke:#555555;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="64.1899" x="148.8269" y="384.9702">&#191;fall&#243; el tick?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="8.5562" x="128.2708" y="379.4702">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="225.0168" y="379.4702">no</text><rect fill="#F1F1F1" height="32" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="123.4004" x="24.0078" y="404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="103.4004" x="34.0078" y="423.2402">No consolidar nada</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="149.416" x="11" y="468"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="87.3809" x="21" y="487.2402">El host aplica su</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="129.416" x="21" y="499.2402">pol&#237;tica de salida segura</text><ellipse cx="85.708" cy="555" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="85.708" cy="555" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="174.0898" x="189.0908" y="404"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="154.0898" x="199.0908" y="423.2402">6. Consolidar estado, salidas</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="100.0371" x="199.0908" y="435.2402">y registros a la vez</text><rect fill="#F1F1F1" height="44" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="191.4395" x="180.416" y="480"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="141.4102" x="190.416" y="499.2402">7. Solo host real: aplicar la</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="171.4395" x="190.416" y="511.2402">intenci&#243;n segura al renderizador</text><ellipse cx="276.1357" cy="567" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="276.1357" cy="567" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="180.9219" x2="180.9219" y1="30" y2="50"/><polygon fill="#555555" points="176.9219,40,180.9219,50,184.9219,40,180.9219,44" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="180.9219" x2="180.9219" y1="94" y2="114"/><polygon fill="#555555" points="176.9219,104,180.9219,114,184.9219,104,180.9219,108" style="stroke:#555555;stroke-width:1.0;"/><line style="stroke:#555555;stroke-width:1.0;" x1="180.9219" x2="180.9219" y1="158" y2="178"/><polygon fill="#5555