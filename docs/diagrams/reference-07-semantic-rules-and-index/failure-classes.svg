<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="540px" preserveAspectRatio="none" style="width:725px;height:540px;background:#FFFFFF;" version="1.1" viewBox="0 0 725 540" width="725px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=4c9a73e9c04e78c54daddb94375eb76827e6f16729fc4c1b06c040767cc7fae1 plantuml=1.2024.7 --><defs/><g><!--entity start--><g id="elem_start"><rect fill="#F1F1F1" height="50.6211" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="175.9175" x="7" y="216.31"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.1392" x="17" y="238.8784">Something went wrong</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.9175" x="17" y="254.1889">or a condition is not met</text></g><!--entity invalid--><g id="elem_invalid"><rect fill="#FFE0E0" height="81.2422" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="146.5913" x="287.14" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7598" x="297.14" y="29.5684">Invalid program</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.5913" x="297.14" y="44.8789">(name/syntax, type,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8672" x="297.14" y="60.1895">branch/definition,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.8901" x="297.14" y="75.5">state boundary)</text></g><!--entity fix--><g id="elem_fix"><rect fill="#F1F1F1" height="35.3105" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="109.0005" x="574.31" y="29.96"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0005" x="584.31" y="52.5284">Fix the source</text></g><!--entity calc--><g id="elem_calc"><rect fill="#FFF0D0" height="50.6211" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="213.375" x="253.74" y="123.31"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.9053" x="263.74" y="145.8784">Value computation error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.375" x="263.74" y="161.1889">(overflow, &#247;0, bad conversion)</text></g><!--entity nocommit--><g id="elem_nocommit"><rect fill="#F1F1F1" height="50.6211" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="137.9204" x="559.85" y="123.31"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.9204" x="569.85" y="145.8784">No successful tick;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.0552" x="569.85" y="161.1889">no partial commit</text></g><!--entity ext--><g id="elem_ext"><rect fill="#E0F0FF" height="65.9316" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="235.0269" x="242.92" y="208.65"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.8833" x="252.92" y="231.2184">External data problem</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.9678" x="252.92" y="246.5289">(sensor fault, schedule Unknown,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0269" x="252.92" y="261.8395">missing/mismatched observation)</text></g><!--entity flow--><g id="elem_flow"><rect fill="#F1F1F1" height="50.6211" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="181.7256" x="537.94" y="212.31"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.0605" x="547.94" y="234.8784">Explicit error flow;</text><text fill="#000000" fon