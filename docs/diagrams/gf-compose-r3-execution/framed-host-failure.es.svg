<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="475px" preserveAspectRatio="none" style="width:644px;height:475px;background:#FFFFFF;" version="1.1" viewBox="0 0 644 475" width="644px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=c9a2fc5e7d1d8fb7d853fa6c054a93b25cce844796dd5240a49b099871ce64e5 plantuml=1.2024.7 --><title>Frontera de reinicio/fallo del host con tramas (contrato existente)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="433.3096" x="98.7605" y="20.7803">Frontera de reinicio/fallo del host con tramas (contrato existente)</text><g id="Ready"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="81.25" y="149"/><line style="stroke:#181818;stroke-width:0.5;" x1="81.25" x2="131.25" y1="172" y2="172"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="27.46" x="92.52" y="164.0103">Listo</text></g><g id="Faulted"><rect fill="#F1F1F1" height="72" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.4961" x="7" y="287"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="205.4961" y1="310" y2="310"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="43.3608" x="84.5676" y="302.0103">En fallo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.1689" x="12" y="325.0103">fallo retenido (latch)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="178.4961" x="12" y="338.0103">el &#250;ltimo resultado consolidado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="93.2344" x="12" y="351.0103">sigue disponible</text></g><ellipse cx="106.25" cy="51" fill="#222222" rx="10" ry="10" style="strok