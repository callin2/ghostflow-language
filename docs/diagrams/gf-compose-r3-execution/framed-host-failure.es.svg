oke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="222.5806" x="409.25" y="171.0103">validaci&#243;n previa al acondicionamiento</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.2007" x="424.4399" y="184.0103">rechazada (se permite reintentar)</text></g><!--link Ready to Faulted--><g id="link_Ready_Faulted"><path d="M106.25,199.27 C106.25,223.09 106.25,253.65 106.25,280.68 " fill="none" id="Ready-to-Faulted" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="106.25,286.68,110.25,277.68,106.25,281.68,102.25,277.68,106.25,286.68" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="149.5952" x="107.25" y="240.0103">falla el acondicionamiento</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8652" x="114.115" y="253.0103">o el despacho de la VM</text></g><!--link Faulted to *end*--><g id="link_Faulted_*end*"><path d="M106.25,359.29 C106.25,388.54 106.25,422.19 106.25,440.7 " fill="none" id="Faulted-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="106.25,446.7,110.25,437.7,106.25,441.7,102.25,437.7,106.25,446.7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.6079" x="107.25" y="400.0103">los pasos siguientes requieren</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.897" x="114.1055" y="413.0103">una nueva instancia de host</text></g></g></svg>