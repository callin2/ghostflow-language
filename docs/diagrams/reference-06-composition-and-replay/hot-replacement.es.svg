<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="559px" preserveAspectRatio="none" style="width:654px;height:559px;background:#FFFFFF;" version="1.1" viewBox="0 0 654 559" width="654px" zoomAndPan="magnify"><title>Reemplazo en caliente del Program (&#167;6.9)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="300.3164" x="175.5295" y="33.5352">Reemplazo en caliente del Program (&#167;6.9)</text><ellipse cx="372.5164" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="270.1294" x="237.4517" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.1294" x="247.4517" y="110.0566">Candidato con nueva revisi&#243;n de fuente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.3887" x="247.4517" y="125.3672">o nuevo cierre de importaci&#243;n</text><polygon fill="#F7F9FC" points="226.3997,158.1094,518.6331,158.1094,530.6331,173.4199,518.6331,188.7305,226.3997,188.7305,214.3997,173.4199,226.3997,158.1094" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.2334" x="226.3997" y="170.6777">&#191;Compatibilidad de puertos, titularidad, perfil,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.3267" x="226.3997" y="185.9883">recursos y estado v&#225;lida?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="204.0149" y="170.6777">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="530.6331" y="170.6777">no</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="307.1108" x="50.8442" y="198.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.1108" x="60.8442" y="221.2988">Consolidar at&#243;micamente en un l&#237;mite de tick</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="386.7993" x="11" y="254.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7993" x="21" y="276.6094">Transferir solo el estado con mismo nombre y mismo tipo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.4336" x="21" y="291.9199">Estado nuevo = valor predeterminado declarado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.3452" x="21" y="307.2305">El estado eliminado desaparece</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="305.3018" x="51.7488" y="339.9727"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.3672" x="61.7488" y="362.541">Descartar la cach&#233; de entradas anterior;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.3018" x="61.7488" y="377.8516">recibir una instant&#225;nea de entradas completa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9707" x="61.7488" y="393.1621">para el nuevo esquema</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="249.1504" x="79.8245" y="425.9043"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.1504" x="89.8245" y="448.4727">Nueva identidad de artefacto/fuente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.937" x="89.8245" y="463.7832">y nuevo l&#237;mite de ejecuci&#243;n (run)</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="205.4849" x="437.8906" y="198.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.4849" x="447.8906" y="221.2988">Mantener el Program anterior</text><polygon fill="#F7F9FC" points="372.5164,482.5254,384.5164,494.5254,372.5164,506.5254,360.5164,494.5254,372.5164,482.5254" style="stroke:#4A6FA5;stroke-width:0.5;"/><ellipse cx="372.5164" cy="537.5254" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="372.5164" cy="537.5254" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="372.5164" x2="372.5164" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="368.5164,77.4883,372.5164,87.4883,376.5164,77.4883,372.5164,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204.3997" x2="204.3997" y1="234.041" y2="254.041"/><polygon fill="#181818" points="200.3997,244.041,204.3997,254.041,208.3997,244.041,204.3997,248.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204.3997" x2="204.3997" y1="319.9727" y2="339.9727"/><polygon fill="#181818" points="200.3997,329.9727,204.3997,339.9727,208.3997,329.9727,204.3997,333.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204.3997" x2="204.3997" y1="405.9043" y2="425.9043"/><polygon fill="#181818" points="200.3997,415.9043,204.3997,425.9043,208.3997,415.9043,204.3997,419.9043" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="214.3997" x2="204.3997" y1="173.4199" y2="173.4199"/><line style="stroke:#181818;stroke-width:1.0;" x