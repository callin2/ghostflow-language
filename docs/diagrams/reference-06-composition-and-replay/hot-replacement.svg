<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="559px" preserveAspectRatio="none" style="width:526px;height:559px;background:#FFFFFF;" version="1.1" viewBox="0 0 526 559" width="526px" zoomAndPan="magnify"><title>Program hot replacement (&#167;6.9)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="229.4209" x="147.1035" y="33.5352">Program hot replacement (&#167;6.9)</text><ellipse cx="289.0664" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="243.52" x="167.3064" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.52" x="177.3064" y="110.0566">Candidate with new source revision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.4336" x="177.3064" y="125.3672">or import closure</text><polygon fill="#F7F9FC" points="183.6731,158.1094,394.4597,158.1094,406.4597,173.4199,394.4597,188.7305,183.6731,188.7305,171.6731,173.4199,183.6731,158.1094" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.7866" x="183.6731" y="170.6777">Port, ownership, profile, resource</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.5044" x="183.6731" y="185.9883">and state compatibility valid?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.6616" x="151.0115" y="170.6777">yes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="406.4597" y="170.6777">no</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="256.3804" x="29.7192" y="198.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.3804" x="39.7192" y="221.2988">Commit atomically at a tick boundary</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="293.8188" x="11" y="254.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8188" x="21" y="276.6094">Transfer only same-name, same-type state</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.2603" x="21" y="291.9199">New state = declared default</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.2168" x="21" y="307.2305">Removed state disappears</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="225.1372" x="45.3408" y="339.9727"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.585" x="55.3408" y="362.541">Discard old input cache;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.1372" x="55.3408" y="377.8516">receive complete input snapshot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.8364" x="55.3408" y="393.1621">for the new schema</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="195.9316" x="59.9436" y="425.9043"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.9316" x="69.9436" y="448.4727">New artifact/source identity</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.3271" x="69.9436" y="463.7832">and new run boundary</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="190.8091" x="324.8188" y="198.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.8091" x="334.8188" y="221.2988">Keep the previous Program</text><polygon fill="#F7F9FC" points="289.0664,482.5254,301.0664,494.5254,289.0664,506.5254,277.0664,494.5254,289.0664,482.5254" style="stroke:#4A6FA5;stroke-width:0.5;"/><ellipse cx="289.0664" cy="537.5254" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="289.0664" cy="537.5254" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="289.0664" x2="289.0664" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="285.0664,77.4883,289.0664,87.4883,293.0664,77.4883,289.0664,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="157.9094" x2="157.9094" y1="234.041" y2="254.041"/><polygon fill="#181818" points="153.9094,244.041,157.9094,254.041,161.9094,244.041,157.9094,248.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="157.9094" x2="157.9094" y1="319.9727" y2="339.9727"/><polygon fill="#181818" points="153.9094,329.9727,157.9094,339.9727,161.9094,329.9727,157.9094,333.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="157.9094" x2="157.9094" y1="405.9043" y2="425.9043"/><polygon fill="#181818" points="153.9094,415.9043,157.9094,425.9043,161.9094,415.9043,157.9094,419.9043" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171.6731" x2="157.9094" y1="173.4199" y2="173.4199"/><line style="stroke:#181818;stroke-width:1.0;" x1="157.9094" x2="157.9094" y1="173.4199" y2="198.7305"/><polygon fill="#181818" points="153.9094,188.7305,157.9094,198.7305,161.9094,188.7305,157.9094,192.7305" style="stroke:#181818;stroke-width:1.0;"/><