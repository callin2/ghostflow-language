<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="558px" preserveAspectRatio="none" style="width:627px;height:558px;background:#FFFFFF;" version="1.1" viewBox="0 0 627 558" width="627px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=800c44f2fba53f14420bac56f0d6b90e07deae705420d505745e457d98b598a0 plantuml=1.2024.7 --><defs/><g><ellipse cx="246.5029" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="225.9941" x="133.5059" y="50"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.9941" x="143.5059" y="72.5684">Compile unchanged fixture once</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5342" x="143.5059" y="87.8789">(numeric-threshold.ghost.md)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="473.0059" x="11" y="120.6211"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.5029" x="23" y="146.6211"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.1982" x="33" y="169.1895">Run native Rust</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5029" x="33" y="184.5">(same bytes, same input tape)</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.5029" x="260.5029" y="146.6211"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.7583" x="270.5029" y="169.1895">Run WASM</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5029" x="270.5029" y="184.5">(same bytes, same input tape)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="473.0059" x="11" y="217.2422"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.3853" x="134.8103" y="243.2422"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3853" x="144.8103" y="265.8105">Compare requested/safe results</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.9204" x="144.8103" y="281.1211">with independent oracle.json</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.0898" x="134.458" y="313.8633"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.8994" x="144.458" y="336.4316">For each in-memory mutant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.0898" x="144.458" y="351.7422">("&lt;" -&gt; "&lt;=", condition -&gt; true)</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206.9893" x="143.0083" y="384.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.9893" x="153.0083" y="407.0527">Mutant must compile and run</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.6855" x="153.0083" y="422.3633">normally on both targets</text><path d="M363.8118,460.1055 L363.8118,476.416 L343.8118,480.416 L363.8118,484.416 L363.8118,500.7266 A0,0 0 0 0 363.8118,500.7266 L615.2952,500.7266 A0,0 0 0 0 615.2952,500.7266 L615.2952,470.1055 L605.2952,460.1055 L363.8118,460.1055 A0,0 0 0 0 363.8118,460.1055 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M605.2952,460.1055 L605.2952,470.1055 L615.2952,470.1055 L605.2952,460.1055 " fill="#FEFFD