<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="662px" preserveAspectRatio="none" style="width:517px;height:662px;background:#FFFFFF;" version="1.1" viewBox="0 0 517 662" width="517px" zoomAndPan="magnify"><title>Proposed optimizer boundary (design only, not implemented)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="409.1377" x="52.6846" y="30.7803">Proposed optimizer boundary (design only, not implemented)</text><ellipse cx="226.5341" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.3906" x="80.3387" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="202.3125" x="90.3387" y="105.0103">Parse, type check, resolve names /</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.3906" x="90.3387" y="118.0103">enums / next-state (existing mandatory checks)</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="310.1133" x="71.4774" y="151"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.1133" x="81.4774" y="171.0103">1. Immutable typed semantic IR + source mapping</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="221.1143" x="81.4774" y="184.0103">+ constraint effects + validation results</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.2788" x="81.4774" y="197.0103">(original executable kept as fallback)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.7134" x="104.1774" y="230"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7134" x="114.1774" y="250.0103">2. Optional typed SMT property checks</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.0361" x="114.1774" y="263.0103">(explicit domains and assumptions)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212.2197" x="120.4242" y="296"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.2197" x="130.4242" y="316.0103">3. BDD candidate only for eligible</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.3843" x="130.4242" y="329.0103">pure, total Boolean regions</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.0469" x="124.0106" y="362"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.0469" x="134.0106" y="382.0103">4. Independent equivalence and</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="93.2026" x="134.0106" y="395.0103">certificate check</text><polygon fill="#F1F1F1" points="158.9601,433.4897,294.108,433.4897,306.108,445.4897,294.108,457.4897,158.9601,457.4897,146.9601,445.4897,158.9601,433.4897" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1479" x="158.9601" y="449">Obligation established?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="126.7301" y="442.5">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.3989" x="306.108" y="429.5">SAT mismatch, Unknown, timeout,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.1563" x="306.108" y="442.5">invalid certificate, ...</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.2861" x="11" y="467.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1416" x="21" y="487.5">Use checked candidate</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.2861" x="21" y="500.5">+ transformation/proof relations</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.2778" x="231.2861" y="467.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.8379" x="241.2861" y="487.5">Keep unchanged original</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="201.2778" x="241.2861" y="500.5">+ bounded skip reason / diagnostic</text><polygon fill="#F1F1F1" points="226.5341,519.4897,238.5341,531.4897,226.5341,543.4897,214.5341,531.4897,226.5341,519.4897" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.5342" x="81.767" y="563.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.5342" x="91.767" y="583.5">5. Emit final bytecode, check resource bounds,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.1079" x="91.767" y="596.5">validate provenance relations</text><ellipse cx="226.5341" cy="640.4897" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="226.5341" cy="640.4897" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="226.5341" x2="226.5341" y1="65" y2="85"/><polygon fill="#181818" points="222.5341,75,226.5341,85,230.5341,75,226.5341,79" style="stroke: