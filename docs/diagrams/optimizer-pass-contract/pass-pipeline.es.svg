<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="675px" preserveAspectRatio="none" style="width:657px;height:675px;background:#FFFFFF;" version="1.1" viewBox="0 0 657 675" width="657px" zoomAndPan="magnify"><title>L&#237;mite propuesto del optimizador (solo dise&#241;o, no implementado)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="435.5723" x="109.3074" y="30.7803">L&#237;mite propuesto del optimizador (solo dise&#241;o, no implementado)</text><ellipse cx="296.4408" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="282.2725" x="155.3046" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="262.2725" x="165.3046" y="105.0103">Analizar, comprobar tipos, resolver nombres /</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="194.4033" x="165.3046" y="118.0103">enumeraciones / estado siguiente</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="236.2852" x="165.3046" y="131.0103">(comprobaciones obligatorias existentes)</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="335.4468" x="128.7174" y="164"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="315.4468" x="138.7174" y="184.0103">1. IR sem&#225;ntica tipada inmutable + mapeo de la fuente</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.3296" x="138.7174" y="197.0103">+ efectos de restricci&#243;n + resultados de validaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="273.1523" x="138.7174" y="210.0103">(ejecutable original conservado como respaldo)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="368.3213" x="112.2802" y="243"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="348.3213" x="122.2802" y="263.0103">2. Comprobaciones opcionales de propiedades SMT tipadas</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="191.4707" x="122.2802" y="276.0103">(dominios y supuestos expl&#237;citos)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="235.3506" x="178.7655" y="309"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.3506" x="188.7655" y="329.0103">3. Candidato BDD solo para regiones</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.0806" x="188.7655" y="342.0103">booleanas puras y totales elegibles</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.3696" x="185.256" y="375"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="202.3696" x="195.256" y="395.0103">4. Comprobaci&#243;n independiente de</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2471" x="195.256" y="408.0103">equivalencia y certificado</text><polygon fill="#F1F1F1" points="223.4523,446.4897,369.4293,446.4897,381.4293,458.4897,369.4293,470.4897,223.4523,470.4897,211.4523,458.4897,223.4523,446.4897" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.9771" x="223.4523" y="462">&#191;Obligaci&#243;n establecida?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="201.3405" y="455.5">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="263.7578" x="381.4293" y="442.5">discrepancia SAT, Unknown, tiempo agotado,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="132.958" x="381.4293" y="455.5">certificado no v&#225;lido, ...</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="279.7715" x="11" y="480.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0488" x="21" y="500.5">Usar el candidato comprobado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="259.7715" x="21" y="513.5">+ relaciones de transformaci&#243;n/demostraci&#243;n</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.4487" x="310.7715" y="480.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="191.4707" x="320.7715" y="500.5">Conservar el original sin cambios</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.4487" x="320.7715" y="513.5">+ motivo de omisi&#243;n acotado / diagn&#243;stico</text><polygon fill="#F1F1F1" points="296.4408,532.4897,308.4408,544.4897,296.4408,556.4897,284.4408,544.4897,296.4408,532.4897" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="309.0469" x="141.9174" y="576.4897"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="275.9961" x="151.9174" y="596.5">5. Emitir el bytecode final, comprobar los l&#237;mites</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="289.0469" x="151.9174" y="609.5">de recursos, validar las relaciones de procedencia</text><ellipse cx="296.4408" cy="653.4897" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="296.4408" cy="653.4897" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="296.4408" x2="296.4408" y1="65" y2="85"/><polygon fill="#181818" points="292.4408,75,296.4408,85,300.4408,75,296.4408,79" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="296.4408" x2="296.4408" y1="144" y2="164"/><polygon fill="#181818" points="292.4408,154,296.4408,164,300.4408,154,296.4408,158" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="296.4408" x2="296.4408" y1="223" y2="243"/><polygon fill="#181818" points="292.4408,233,296.4408,243,300.4408,233,296.4408,237" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="296.4408" x2="296.4408" y1="289" y2="309"/><polygon fill="#181818" points="292.4408,299,296.4408,309,300.4408,299,296.4408,303" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="296.4408" x2="296.4408" y1="355" y2="375"/><polygon fill="#181818" points="292.4408,365,296.4408,375,300.4408,365,296.4408,369" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="211.4523" x2="150.8857" y1="458.4897" y2="458.4897"/><line style="stroke:#181818;stroke-width:1.0;" x1="150.8857" x2="150.8857" y1="458.4897" y2="480.4897"/><polygon fill="#181818" points="146.8857,470.4897,150.8857,480.4897,154.8857,470.4897,150.8857,474.4897" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="381.4293" x2="441.9958" y1="458.4897" y2="458.4897"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.9958" x2="441.9958" y1="458.4897" y2="480.4897"/><polygon fill="#181818" points="437.9958,470.4897,441.9958,480.4897,445.9958,470.4897,441.9958,474