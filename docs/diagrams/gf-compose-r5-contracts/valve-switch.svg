<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="477px" preserveAspectRatio="none" style="width:644px;height:477px;background:#FFFFFF;" version="1.1" viewBox="0 0 644 477" width="644px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=2167a7a20e220d402059069daddc1e4f0841bc3a2ecee435fe7f7b5c95ec9414 plantuml=1.2024.7 --><title>Valve-switch counterexample (hand-worked, not execution evidence)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="459.0059" x="92.0656" y="25.7803">Valve-switch counterexample (hand-worked, not execution evidence)</text><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="75" x2="75" y1="94" y2="419"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="271.0371" x2="271.0371" y1="94" y2="419"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="530.699" x2="530.699" y1="94" y2="419"/><rect fill="#E2E2F0" height="40" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.8862" x="5" y="53"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="44.1477" y="70.0103">Behavior A</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.8862" x="12" y="83.0103">(pump session owner)</text><rect fill="#E2E2F0" height="40" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.8862" x="5" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="44.1477" y="435.0103">Behavior A</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.8862" x="12" y="448.0103">(pump session owner)</text><rect fill="#E2E2F0" height="53" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="138.2935" x="202.0371" y="40"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3208" x="232.5234" y="57.0103">Station policy</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="209.0371" y="70.0103">(prepare_start_batch,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1816" x="220.593" y="83.0103">authorize_output)</text><rect fill="#E2E2F0" height="53" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="138.2935" x="202.0371" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3208" x="232.5234" y="435.0103">Station policy</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="209.0371" y="448.0103">(prepare_start_batch,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1816" x="220.593" y="461.0103">authorize_output)</text><rect fill="#E2E2F0" height="27" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="77.5908" x="492.699" y="66"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="499.699" y="83.0103">Behavior B</text><rect fill="#E2E2F0" height="27" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="77.5908" x="492.699" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="499.699" y="435.0103">Behavior B</text><polygon fill="#181818" points="259.1838,119,269.1838,123,259.1838,127,263.1838,123" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="75.9431" x2="265.1838" y1="123" y2="123"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2407" x="82.9431" y="118.0103">pump session active (ValveA)</text><polygon fill="#181818" points="259.1838,159,269.1838,163,259.1838,167,263.1838,163" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="75.9431" x2="265.1838" y1="163" y2="163"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.0254" x="82.9431" y="145.0103">pump OFF briefly,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.7861" x="82.9431" y="158.0103">change ValveA -&gt; ValveB</text><path d="M199,176 L199,212 L341,212 L341,186 L331,176 L199,176 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M331,176 L331,186 L341,186 L331,176 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.8398" x="205" y="191.0103">Session is retained</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="121.3989" x="205" y="204.0103">across valve cleanup</text><line style="stroke:#181818;stroke-width:1.0;" x1="531.4944" x2="573.4944" y1="236" y2="236"/><line style="stroke:#181818;stroke-width:1.0;" x1="573.4944" x2="573.4944" y1="236" y2="249"/><line style="stroke:#181818;stroke-width:1.0;" x1="532.4944" x2="573.4944" y1="249" y2="249"/><polygon fill="#181818" points="542.4944,245,532.4944,249,542.4944,253,538.4944,249" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="98.6426" x="538.4944" y="231.0103">sees pump=false</text><polygon fill="#181818" points="282.1838,272,272.1838,276,282.1838,280,278.1838,276" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="276.1838" x2="530.4944" y1="276" y2="276"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="187.1543" x="288.1838" y="271.0103">request the same physical pump</text><polygon fill="#181818" points="519.4944,325,529.4944,329,519.4944,333,523.4944,329" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="271.1838" x2="525.4944" y1="329" y2="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.3989" x="278.1838" y="298.0103">rejected (AlreadyOwned):</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.0044" x="278.1838" y="311.0103">A still owns the session;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="236.3105" x="278.1838" y="324.0103">an inactive control cannot stop the owner</text><path d="M23,342 L23,404 L583,404 L583,352 L573,342 L23,342 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M573,342 L573,352 L583,352 L573,342 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.3374" x="123.7924" y="357.0103">A local rule "pump is off, therefore B may start"</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.6987" x="123.7924" y="370.0103">would break the session ownership invariant.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="264.4814" x="123.7924" y="383.0103">This is a bounded station claim only, not proof</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="349.7051" x="123.7924" y="396.0103">that arbitrary composed behaviors share resources correctly.</text></g></svg>