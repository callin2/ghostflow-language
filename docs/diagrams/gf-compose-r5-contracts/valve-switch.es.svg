<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="477px" preserveAspectRatio="none" style="width:695px;height:477px;background:#FFFFFF;" version="1.1" viewBox="0 0 695 477" width="695px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=3fc6b63eec5a47cc32c34290c0f9cd76f3ff2791d2a2f09339b1dcb187265184 plantuml=1.2024.7 --><title>Contraejemplo de cambio de v&#225;lvula (elaborado a mano, no evidencia de ejecuci&#243;n)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="557.04" x="68.8993" y="25.7803">Contraejemplo de cambio de v&#225;lvula (elaborado a mano, no evidencia de ejecuci&#243;n)</text><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="99" x2="99" y1="94" y2="419"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="313.3315" x2="313.3315" y1="94" y2="419"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="596.7361" x2="596.7361" y1="94" y2="419"/><rect fill="#E2E2F0" height="40" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.8716" x="5" y="53"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3799" x="45.2458" y="70.0103">Comportamiento A</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.8716" x="12" y="83.0103">(titular de la sesi&#243;n de bomba)</text><rect fill="#E2E2F0" height="40" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.8716" x="5" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3799" x="45.2458" y="435.0103">Comportamiento A</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.8716" x="12" y="448.0103">(titular de la sesi&#243;n de bomba)</text><rect fill="#E2E2F0" height="53" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="138.2935" x="244.3315" y="40"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="112.7344" x="257.1111" y="57.0103">Pol&#237;tica de estaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="251.3315" y="70.0103">(prepare_start_batch,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1816" x="262.8875" y="83.0103">authorize_output)</text><rect fill="#E2E2F0" height="53" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="138.2935" x="244.3315" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="112.7344" x="257.1111" y="435.0103">Pol&#237;tica de estaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="251.3315" y="448.0103">(prepare_start_batch,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1816" x="262.8875" y="461.0103">authorize_output)</text><rect fill="#E2E2F0" height="27" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="122.3799" x="535.7361" y="66"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3799" x="542.7361" y="83.0103">Comportamiento B</text><rect fill="#E2E2F0" height="27" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="122.3799" x="535.7361" y="418"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3799" x="542.7361" y="435.0103">Comportamiento B</text><polygon fill="#181818" points="301.4783,119,311.4783,123,301.4783,127,305.4783,123" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="99.4358" x2="307.4783" y1="123" y2="123"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="190.0425" x="106.4358" y="118.0103">sesi&#243;n de bomba activa (ValveA)</text><polygon fill="#181818" points="301.4783,159,311.4783,163,301.4783,167,305.4783,163" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="99.4358" x2="307.4783" y1="163" y2="163"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.2998" x="106.4358" y="145.0103">bomba en OFF brevemente,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.0435" x="106.4358" y="158.0103">cambio ValveA -&gt; ValveB</text><path d="M214,176 L214,212 L412,212 L412,186 L402,176 L214,176 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M402,176 L402,186 L412,186 L402,176 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.3525" x="220" y="191.0103">La sesi&#243;n se conserva</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.7661" x="220" y="204.0103">durante la limpieza de v&#225;lvulas</text><line style="stroke:#181818;stroke-width:1.0;" x1="596.926" x2="638.926" y1="236" y2="236"/><line style="stroke:#181818;stroke-width:1.0;" x1="638.926" x2="638.926" y1="236" y2="249"/><line style="stroke:#181818;stroke-width:1.0;" x1="597.926" x2="638.926" y1="249" y2="249"/><polygon fill="#181818" points="607.926,245,597.926,249,607.926,253,603.926,249" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.9126" x="603.926" y="231.0103">ve pump=false</text><polygon fill="#181818" points="324.4783,272,314.4783,276,324.4783,280,320.4783,276" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="318.4783" x2="595.926" y1="276" y2="276"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="172.6689" x="330.4783" y="271.0103">solicita la misma bomba f&#237;sica</text><polygon fill="#181818" points="584.926,325,594.926,329,584.926,333,588.926,329" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="313.4783" x2="590.926" y1="329" y2="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.8589" x="320.4783" y="298.0103">rechazado (AlreadyOwned):</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.2852" x="320.4783" y="311.0103">A sigue siendo titular de la sesi&#243;n;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="259.4478" x="320.4783" y="324.0103">un control inactivo no puede detener al titular</text><path d="M24,342 L24,404 L672,404 L672,352 L662,342 L24,342 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M662,342 L662,352 L672,352 L662,342 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="403.2729" x="100.0587" y="357.0103">Una regla local &#171;la bomba est&#225; apagada, por tanto B puede arrancar&#187;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.3823" x="100.0587" y="370.0103">romper&#237;a el invariante de titularidad de la sesi&#243;n.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="374.353" x="100.0587" y="383.0103">Es solo una afirmaci&#243;n acotada sobre la estaci&#243;n, no una prueba</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="486.9985" x="100.0587" y="396.0103">de que comportamientos compuestos arbitrarios compartan recursos correctamente.</text></g></svg>