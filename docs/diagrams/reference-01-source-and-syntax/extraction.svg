<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="517px" preserveAspectRatio="none" style="width:581px;height:517px;background:#FFFFFF;" version="1.1" viewBox="0 0 581 517" width="581px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=4cb133a9568706acc17f1fb89a88e515e51e9596045d7a67757baf7ed3b335f8 plantuml=1.2024.7 --><defs/><g><ellipse cx="133.2297" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.4595" x="11" y="50"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.4595" x="21" y="72.5684">One canonical .ghost.md document</text><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="164.187" x="51.1362" y="105.3105"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.187" x="61.1362" y="127.8789">Parse as CommonMark</text><path d="M275.0056,150.6211 L275.0056,189.8975 L255.0056,193.8975 L275.0056,197.8975 L275.0056,237.1738 A0,0 0 0 0 275.0056,237.1738 L569.7102,237.1738 A0,0 0 0 0 569.7102,237.1738 L569.7102,160.6211 L559.7102,150.6211 L275.0056,150.6211 A0,0 0 0 0 275.0056,150.6211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M559.7102,150.6211 L559.7102,160.6211 L569.7102,160.6211 L559.7102,150.6211 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.7046" x="281.0056" y="168.1895">Not executable: prose, tables, front matter,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7896" x="281.0056" y="183.5">indented code, other info strings,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.605" x="281.0056" y="198.8105">ghost fences nested in lists/quotes or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.5718" x="281.0056" y="214.1211">written inside a longer display fence,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.897" x="281.0056" y="229.4316">ghost-python, ghost with attributes</text><rect fill="#F1F1F1" height="65.9316" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.5518" x="11.4539" y="160.9316"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.5518" x="21.4539" y="183.5">Select top-level fenced code blocks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.3354" x="21.4539" y="198.8105">whose info string is exactly ghost</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.0161" x="21.4539" y="214.1211">(backtick or tilde fences)</text><rect fill="#F1F1F1" height="65.9316" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.252" x="15.1038" y="257.1738"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.7466" x="25.1038" y="279.7422">Keep document order;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.4995" x="25.1038" y="295.0527">end each body with a newline;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.252" x="25.1038" y="310.3633">put one blank line between blocks</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.5" x="22.4797" y="343.1055"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.5" x="32.4797" y="365.6738">Parse the result as one program</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.708" x="32.4797" y="380.9844">with exactly one root control</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.9355" x="30.262" y="413.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9355" x="40.262" y="436.2949">Report diagnostics at original</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.9209" x="40.262" y="451.6055">file, line and column</text><ellipse cx="133.2297" cy="495.3477" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="133.2297" cy="495.3477" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="30" y2="50"/><polygon fill="#181818" points="129.2297,40,133.2297,50,137.2297,40,133.2297,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="85.3105" y2="105.3105"/><polygon fill="#181818" points="129.2297,95.3105,133.2297,105.3105,137.2297,95.3105,133.2297,99.3105" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="140.6211" y2="160.9316"/><polygon fill="#181818" points="129.2297,150.9316,133.2297,160.9316,137.2297,150.9316,133.2297,154.9316" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="226.8633" y2="257.1738"/><polygon fill="#181818" points="129.2297,247.1738,133.2297,257.1738,137.2297,247.1738,133.2297,251.1738" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="323.1055" y2="343.1055"/><polygon fill="#181818" points="129.2297,333.1055,133.2297,343.1055,137.2297,333.1055,133.2297,337.1055" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="393.7266" y2="413.7266"/><polygon fill="#181818" points="129.2297,403.7266,133.2297,413.7266,137.2297,403.7266,133.2297,407.7266" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="133.2297" x2="133.2297" y1="464.3477" y2="484.3477"/><polygon fill="#181818" points="129.2297,474.3477,133.2297,484.3477,137.2297,474.3477,133.2297,478.3477" style="stroke:#181818;stroke-width:1.0;"/></g></svg>