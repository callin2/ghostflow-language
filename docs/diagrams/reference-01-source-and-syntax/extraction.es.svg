<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="524px" preserveAspectRatio="none" style="width:733px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 733 524" width="733px" zoomAndPan="magnify"><defs/><g><ellipse cx="166.812" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="241.1587" x="46.2327" y="50"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.1587" x="56.2327" y="72.5684">Un documento .ghost.md can&#243;nico</text><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="203.2759" x="65.1741" y="105.3105"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.2759" x="75.1741" y="127.8789">Analizar como CommonMark</text><path d="M342.624,157.9658 L342.624,197.2422 L322.624,201.2422 L342.624,205.2422 L342.624,244.5186 A0,0 0 0 0 342.624,244.5186 L721.0542,244.5186 A0,0 0 0 0 721.0542,244.5186 L721.0542,167.9658 L711.0542,157.9658 L342.624,157.9658 A0,0 0 0 0 342.624,157.9658 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M711.0542,157.9658 L711.0542,167.9658 L721.0542,167.9658 L711.0542,157.9658 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.6973" x="348.624" y="175.5342">No ejecutable: prosa, tablas, front matter,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.2261" x="348.624" y="190.8447">c&#243;digo indentado, otras cadenas de informaci&#243;n,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.4297" x="348.624" y="206.1553">bloques ghost anidados en listas/citas o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.4302" x="348.624" y="221.4658">escritos dentro de un bloque de visualizaci&#243;n m&#225;s largo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.7847" x="348.624" y="236.7764">ghost-python, ghost con atributos</text><rect fill="#F1F1F1" height="81.2422" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="311.624" x="11" y="160.6211"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.624" x="21" y="183.1895">Seleccionar los bloques de c&#243;digo delimitados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4888" x="21" y="198.5">de nivel superior cuya cadena de informaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.3916" x="21" y="213.8105">es exactamente ghost</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0391" x="21" y="229.1211">(delimitadores de acento grave o tilde)</text><rect fill="#F1F1F1" height="65.9316" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.1362" x="19.7439" y="264.5186"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.915" x="29.7439" y="287.0869">Mantener el orden del documento;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.1362" x="29.7439" y="302.3975">terminar cada cuerpo con un salto de l&#237;nea;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.7188" x="29.7439" y="317.708">poner una l&#237;nea en blanco entre bloques</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7822" x="29.4209" y="350.4502"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.7822" x="39.4209" y="373.0186">Analizar el resultado como un programa</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.293" x="39.4209" y="388.3291">con exactamente un control ra&#237;z</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.9033" x="43.3604" y="421.0713"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9033" x="53.3604" y="443.6396">Informar diagn&#243;sticos en el archivo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.8921" x="53.3604" y="458.9502">la l&#237;nea y la columna originales</text><ellipse cx="166.812" cy="502.6924" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="166.812" cy="502.6924" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.812" x2="166.812" y1="30" y2="50"/><polygon fill="#181818" points="162.812,40,166.812,50,170.812,40,166.812,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.812" x2="166.812" y1="85.3105" y2="105.3105"/><polygon fill="#181818" points="162.812,95.3105,166.812,105.3105,170.812,95.3105,166.812,99.3105" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.812" x2="166.812" y1="140.6211" y2="160.6211"/><polygon fill="#181818" points="162.812,150.6211,166.812,160.6211,170.812,150.6211,166.812,154.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="166.812" x2="166.812" y1="241.8633" y2="264.5186"/><polygon fill="#181818" points="162.812,254.5186,166.812,264.5186,170.812,254.5186,166.812,258.5186" style="s