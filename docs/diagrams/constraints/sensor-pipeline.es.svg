<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="110px" preserveAspectRatio="none" style="width:1454px;height:110px;background:#FFFFFF;" version="1.1" viewBox="0 0 1454 110" width="1454px" zoomAndPan="magnify"><title>Orden de procesamiento del sensor en el ejemplo de humedad</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="417.7783" x="511.5597" y="20.7803">Orden de procesamiento del sensor en el ejemplo de humedad</text><!--entity drv--><g id="elem_drv"><rect fill="#FFFFFF" height="48" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="207.9336" x="7" y="49"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="37.3311" x="17" y="69.7803">Driver</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="187.9336" x="17" y="83.7803">ID de muestra nueva + tiempo</text></g><!--entity val--><g id="elem_val"><rect fill="#FFFFFF" height="48" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="155.4336" x="275.93" y="49"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.4336" x="285.93" y="69.7803">Validaci&#243;n de entrada</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.3477" x="285.93" y="83.7803">valid = 0% .. 100%</text></g><!--entity flt--><g id="elem_flt"><rect fill="#FFFFFF" height="48" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="83.0273" x="492.37" y="49"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="31.1104" x="502.37" y="69.7803">Filtro</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="63.0273" x="502.37" y="83.7803">median(5)</text></g><!--entity fr--><g id="elem_fr"><rect f