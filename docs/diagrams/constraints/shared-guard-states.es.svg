<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="477px" preserveAspectRatio="none" style="width:680px;height:477px;background:#FFFFFF;" version="1.1" viewBox="0 0 680 477" width="680px" zoomAndPan="magnify"><title>Guarda Bool compartida: admisi&#243;n, disparo y recuperaci&#243;n (un grupo exclusivo)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="536.7646" x="64.8562" y="20.7803">Guarda Bool compartida: admisi&#243;n, disparo y recuperaci&#243;n (un grupo exclusivo)</text><ellipse cx="384.22" cy="51" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="Idle"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="134.7266" x="316.85" y="122.5"/><line style="stroke:#555555;stroke-width:0.5;" x1="316.85" x2="451.5766" y1="146.5" y2="146.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="372.9271" y="138.2803">Idle</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="114.7266" x="321.85" y="160.7402">sin actividad admitida</text></g><g id="Admitted"><rect fill="#FFFFFF" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="176.4336" x="7" y="274.5"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="183.4336" y1="298.5" y2="298.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="55.248" x="67.5928" y="290.2803">Admitted</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="156.4336" x="12" y="312.7402">salidas = candidato solicitado</text></g><g id="Tripped"><rect fill="#FFFFFF" height="58" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="193.7656" x="201.33" y="413"/><line style="stroke:#555555;stroke-width:0.5;" x1="201.33" x2="395.0956" y1="437" y2="437"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="47.4688" x="274.4784" y="428.7803">Tripped</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="173.7656" x="206.33" y="451.2402">salidas = vector seguro del autor</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.416" x="206.33" y="463.2402">(p. ej., pump=false, valve=true)</text></g><!--link *start* to Idle--><g id="link_*start*_Idle"><path d="M384.22,61.41 C384.22,75.41 384.22,96.22 384.22,116.02 " fill="none" id="*start*-to-Idle" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="384.22,122.02,388.22,113.02,384.22,117.02,380.22,113.02,384.22,122.02" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Idle to Admitted--><g id="link_Idle_Admitted"><path d="M327.57,173 C307.39,182.05 284.61,192.63 264.22,203 C219.61,225.68 175.0513,251.1373 141.1613,271.0773 " fill="none" id="Idle-to-Admitted" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="135.99,274.12,145.7754,273.0035,140.2994,271.5845,141.7185,266.1085,135.99,274.12" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.3525" x="305.1499" y="214.0103">nuevo reclamo en true</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.2124" x="265.22" y="227.0103">+ todas las condiciones de admisi&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.3896" x="270.6314" y="240.0103">+ el candidato cumple safe_output</text></g><!--link Idle to Idle--><g id="link_Idle_Idle"><path d="M451.65,137.03 C471.33,137.39 486.58,140.88 486.58,147.5 C486.58,154.12 477.329,157.5003 457.649,157.8603 " fill="none" id="Idle-to-Idle" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="451.65,157.97,460.7217,161.8047,456.6492,157.8786,460.5753,153.8061,451.65,157.97" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.897" x="492.58" y="138.0103">el candidato viola una relaci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2598" x="507.3986" y="151.0103">(denegado: sin admisi&#243;n,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.3779" x="502.3395" y="164.0103">sin nueva salida protegida)</text></g><!--link Admitted to Admitted--><g id="link_Admitted_Admitted"><path d="M183.83,286.79 C203.81,287.93 218.43,292.17 218.43,299.5 C218.43,306.83 209.8003,310.7282 189.8203,311.8682 " fill="none" id="Admitted-to-Admitted" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="183.83,312.21,193.0432,315.6908,188.8219,311.9252,192.5875,307.7038,183.83,312.21" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2388" x="224.43" y="290.0103">reclamo de reci&#233;n llegado en conflicto</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.8105" x="225.1441" y="303.0103">(denegado; se mantienen la admisi&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.0488" x="225.525" y="316.0103">vigente y las salidas seguras previas)</text></g><!--link Admitted to Tripped--><g id="link_Admitted_Tripped"><path d="M130.58,324.97 C165.9,349.42 215.2365,383.5653 252.3965,409.2853 " fill="none" id="Admitted-to-Tripped" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="257.33,412.7,252.2062,404.2889,253.2187,409.8544,247.6532,410.867,257.33,412.7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.918" x="228.2972" y="366.0103">el candidato solicitado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.7725" x="209.87" y="379.0103">viola una relaci&#243;n obligatoria</text></g><!--link Tripped to Tripped--><g id="link_Tripped_Tripped"><path d="M395.41,428.79 C415.59,430.18 430.1,434.59 430.1,442 C430.1,449.41 421.5758,453.4077 401.3958,454.7977 " fill="none" id="Tripped-to-Tripped" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="395.41,455.21,404.6636,458.5821,400.3982,454.8664,404.1139,450.601,395.41,455.21" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="211.7388" x="436.1" y="439.0103">las entradas vuelven a la normalidad</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.2744" x="473.3322" y="452.0103">(sin reinicio autom&#225;tico)</text></g><!--link Tripped to Idle--><g id="link_Tripped_Idle"><path d="M341.75,412.79 C355.28,403.62 370.09,393.19 383.22,383 C414.07,359.06 427.09,357.18 449.22,325 C470.97,293.36 472.44,281.79 479.22,244 C482.43,226.06 488.35,218.77 479.22,203 C471.97,190.5 465.7473,183.7911 453.4173,176.0811 " fill="none" id="Tripped-to-Idle" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="448.33,172.9,453.8402,181.0632,452.5694,175.5509,458.0817,174.2801,448.33,172.9" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.6689" x="505.6872" y="296.5103">observaci&#243;n con</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.5234" x="474.26" y="309.5103">todos los reclamos en false</text></g><!--SRC=[PLFDZjCm4BxdAKRYieNkthWiAXAinC-54n87Y