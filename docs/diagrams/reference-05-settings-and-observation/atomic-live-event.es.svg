<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="571px" preserveAspectRatio="none" style="width:1301px;height:571px;background:#FFFFFF;" version="1.1" viewBox="0 0 1301 571" width="1301px" zoomAndPan="magnify"><title>Evento at&#243;mico de ajustes en vivo (&#167;5.2)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="292.0996" x="503.3821" y="33.5352">Evento at&#243;mico de ajustes en vivo (&#167;5.2)</text><ellipse cx="856.7095" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="223.4678" x="744.9756" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.9209" x="754.9756" y="110.0566">Llega un evento de ajustes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.4678" x="754.9756" y="125.3672">(Program destino, revisi&#243;n base,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.9922" x="754.9756" y="140.6777">conjunto de destinos, payloads)</text><polygon fill="#F7F9FC" points="711.4211,173.4199,1001.9978,173.4199,1013.9978,196.3857,1001.9978,219.3516,711.4211,219.3516,699.4211,196.3857,711.4211,173.4199" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.5767" x="711.4211" y="185.9883">&#191;Sobre &#237;ntegro, mismo Program, base vigente,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.562" x="711.4211" y="201.2988">destinos conocidos, no vac&#237;o, sin duplicados,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1309" x="711.4211" y="216.6094">productor autorizado?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="689.0364" y="193.6436">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="1013.9978" y="193.6436">no</text><polygon fill="#F7F9FC" points="32,254.3516,250.8608,254.3516,262.8608,269.6621,250.8608,284.9727,32,284.9727,20,269.6621,32,254.3516" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="145.4304" y="297.541">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.8608" x="32" y="266.9199">&#191;El grupo mezcla distintos c&#243;digos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.3999" x="32" y="282.2305">de fallo expl&#237;citos?</text><rect fill="#FDECEA" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="259.2114" x="11.8247" y="320.2832"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2114" x="21.8247" y="342.8516">Rechazar como paquete inconsistente</text><ellipse cx="141.4304" cy="401.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="141.4304" cy="401.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F7F9FC" points="303.0361,254.3516,564.5977,254.3516,576.5977,269.6621,564.5977,284.9727,303.0361,284.9727,291.0361,269.6621,303.0361,254.3516" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="437.8169" y="297.541">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5615" x="303.0361" y="266.9199">&#191;Alg&#250;n payload falla la validaci&#243;n de tipo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4893" x="303.0361" y="282.2305">rango, step o capacidad de lista?</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="190.041" x="338.7964" y="320.2832"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.041" x="348.7964" y="342.8516">Emitir fault(SettingsInvalid)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.8833" x="348.7964" y="358.1621">a todos los destinos</text><polygon fill="#F7F9FC" points="608.5977,257.6621,868.1914,257.6621,880.1914,269.6621,868.1914,281.6621,608.5977,281.6621,596.5977,269.6621,608.5977,257.6621" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="742.3945" y="294.2305">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.5938" x="608.5977" y="274.5752">&#191;Productor expl&#237;citamente no disponible?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="880.1914" y="266.9199">no</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="220.6621" x="628.0635" y="316.9727"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.6621" x="638.0635" y="339.541">Emitir fault(SettingsUnavailable)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.8833" x="638.0635" y="354.8516">a todos los destinos</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="146.8833" x="900.1914" y="333.1621"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.0078" x="910.1914" y="355.7305">Emitir ok(value)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.8833" x="910.1914" y="371.041">a todos los destinos</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="310.0435" x="374.428" y="452.5938"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.8945" x="384.428" y="475.1621">Nueva revisi&#243;n de ajustes + posici&#243;n efectiva.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2466" x="384.428" y="490.4727">Misma fuente, Program y runId.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.0435" x="384.428" y="505.7832">El estado y los temporizadores no se reinician</text><ellipse cx="529.4497" cy="549.5254" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="529.4497" cy="549.5254" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FDECEA" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="233.7891" x="1057.0747" y="229.3516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.8071" x="1067.0747" y="251.9199">Rechazar antes de la admisi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.7891" x="1067.0747" y="267.2305">(ninguna emisi&#243;n en ning&#250;n flujo)</text><ellipse cx="1173.9692" cy="325.9727" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="1173.9692" cy="325.9727" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="85