" lengthAdjust="spacing" textLength="217.6611" x="41.998" y="284.4316">3. Verified bytecode, WASM/native</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.2314" x="41.998" y="299.7422">activation, prelude execution</text><rect fill="#F8F8F8" height="50.6211" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="279.6572" x="11" y="332.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.6572" x="21" y="355.0527">4. Prove source -&gt; artifact -&gt; execution;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.0928" x="21" y="370.3633">remove emission rejection and host .due</text><rect fill="#F8F8F8" height="50.6211" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="226.5591" x="37.5491" y="403.1055"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.5591" x="47.5491" y="425.6738">5. Extend policy to Window/Run,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.0513" x="47.5491" y="440.9844">cancellation, held clocks</text><ellipse cx="150.8286" cy="484.7266" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="150.8286" cy="484.7266" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="150.8286" x2="150.8286" y1="30" y2="50"/><polygon fill="#181818" points="146.8286,40,150.8286,50,154.8286,40,150.8286,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="150.8286" x2="150.8286" y1="100.6211" y2="120.6211"/><polygon fill="#181818" points="146.8286,110.6211,150.8286,120.6211,154.8286,110.6211,150.8286,114.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="150.8286" x2="150.8286" y1="