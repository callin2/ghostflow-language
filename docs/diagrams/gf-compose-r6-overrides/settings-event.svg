<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="560px" preserveAspectRatio="none" style="width:549px;height:560px;background:#FFFFFF;" version="1.1" viewBox="0 0 549 560" width="549px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=4a55d237baeb9836b2a1e1fdbd9cf5ba4188b8c8870ae5a88a7774d00e99cc6b plantuml=1.2024.7 --><title>Operator property event (approved design, not implemented)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="405.2822" x="70.7454" y="30.7803">Operator property event (approved design, not implemented)</text><ellipse cx="204.1479" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="191.2407" x="108.5276" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="118.5276" y="105.0103">Operator submits one action</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.2407" x="118.5276" y="118.0103">(one or more property values)</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.8315" x="70.2322" y="151"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2661" x="80.2322" y="171.0103">Validate the whole event:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.8188" x="80.2322" y="184.0103">identity join (stale program identity?)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="247.8315" x="80.2322" y="197.0103">and every value (type, finite, min/max/step)</text><path d="M292.0278,220 L292.0278,295 L537.7729,295 L537.7729,230 L527.7729,220 L292.0278,220 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M527.7729,220 L527.7729,230 L537.7729,230 L527.7729,220 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7451" x="298.0278" y="235.0103">Unchanged: program/source/bytecode,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="194.397" x="298.0278" y="248.0103">run identity, deployment package.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.2998" x="298.0278" y="261.0103">No recompile, repackage, or</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="194.3779" x="298.0278" y="274.0103">controller-wide maintenance stop.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.2915" x="298.0278" y="287.0103">Open: durability and failure ordering.</text><polygon fill="#F1F1F1" points="128.2681,295,280.0278,295,292.0278,307,280.0278,319,128.2681,319,116.2681,307,128.2681,295" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.7598" x="128.2681" y="310.5103">Stale or any value invalid?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="96.0381" y="304.0103">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="43.3545" x="292.0278" y="304.0103">all valid</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="190.5361" x="11" y="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1353" x="21" y="349.0103">Reject the whole event;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="170.5361" x="21" y="362.0103">no mutation; prior values kept</text><ellipse cx="106.2681" cy="406" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="106.2681" cy="406" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.6099" x="234.2229" y="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.6099" x="244.2229" y="349.0103">Apply at its effective</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.2217" x="244.2229" y="362.0103">event position</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="150.0508" x="227.0024" y="395"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.0508" x="237.0024" y="415.0103">New settings revision /</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.8335" x="237.0024" y="428.0103">effective position</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="142.8398" x="132.728" y="461"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.8398" x="142.728" y="481.0103">Active logic responds</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="112.728" x="142.728" y="494.0103">under existing rules</text><ellipse cx="204.1479" cy="538" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="204.1479" cy="538" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204.1479" x2="204.1479" y1="65" y2="85"/><polygon fill="#181818" points="200.1479,75,204.1479,85