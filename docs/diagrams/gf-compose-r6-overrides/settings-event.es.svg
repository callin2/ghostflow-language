<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="560px" preserveAspectRatio="none" style="width:703px;height:560px;background:#FFFFFF;" version="1.1" viewBox="0 0 703 560" width="703px" zoomAndPan="magnify"><title>Evento de propiedad del operador (dise&#241;o aprobado, no implementado)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="476.8203" x="111.8383" y="30.7803">Evento de propiedad del operador (dise&#241;o aprobado, no implementado)</text><ellipse cx="281.6143" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.3906" x="174.4189" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.1143" x="184.4189" y="105.0103">El operador env&#237;a una acci&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="194.3906" x="184.4189" y="118.0103">(uno o m&#225;s valores de propiedad)</text><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.2813" x="106.4736" y="151"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.8125" x="116.4736" y="171.0103">Validar el evento completo:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="330.2813" x="116.4736" y="184.0103">uni&#243;n de identidades (&#191;identidad de programa obsoleta?)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="222.5298" x="116.4736" y="197.0103">y cada valor (tipo, finito, min/max/step)</text><path d="M390.0891,220 L390.0891,295 L691.4968,295 L691.4968,230 L681.4968,220 L390.0891,220 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M681.4968,220 L681.4968,230 L691.4968,230 L681.4968,220 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="233.4097" x="396.0891" y="235.0103">Sin cambios: programa/fuente/bytecode,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="271.7749" x="396.0891" y="248.0103">identidad de ejecuci&#243;n, paquete de despliegue.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="184.9771" x="396.0891" y="261.0103">Sin recompilar, reempaquetar ni</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.4077" x="396.0891" y="274.0103">parada de mantenimiento de todo el controlador.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.4751" x="396.0891" y="287.0103">Abierto: durabilidad y orden ante fallos.</text><polygon fill="#F1F1F1" points="185.1394,295,378.0891,295,390.0891,307,378.0891,319,185.1394,319,173.1394,307,185.1394,295" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.9497" x="185.1394" y="310.5103">&#191;Obsoleto o alg&#250;n valor inv&#225;lido?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="163.0276" y="304.0103">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="390.0891" y="304.0103">todos v&#225;lidos</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="288.7915" x="11" y="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.9834" x="21" y="349.0103">Rechazar el evento completo;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.7915" x="21" y="362.0103">sin mutaci&#243;n; se conservan los valores previos</text><ellipse cx="155.3958" cy="406" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="155.3958" cy="406" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.458" x="334.6038" y="329"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="126.458" x="344.6038" y="349.0103">Aplicar en su posici&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="105.5171" x="344.6038" y="362.0103">efectiva de evento</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.0825" x="319.7915" y="395"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.0825" x="329.7915" y="415.0103">Nueva revisi&#243;n de ajustes /</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.1099" x="329.7915" y="428.0103">posici&#243;n efectiva</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.8125" x="193.208" y="461"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.4307" x="203.208" y="481.0103">La l&#243;gica activa responde</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="156.8125" x="203.208" y="494.0103">seg&#250;n las reglas existentes</text><ellipse cx="281.6143" cy="538" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="281.6143" cy="538" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="281.6143" x2="281.6143" y1="65" y2="85"/><polygon fill="#181818" points="277.6143,75,281.6143,85,285.6143,75,281.6143,79" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="281.6143" x2="281.6143" y1="131" y2="151"/><polygon fill="#181818" points="277.6143,141,281.6143,151,285.6143,141,281.6143,145" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="155.3958" x2="155.3958" y1="375" y2="395"/><polygon fill="#181818" points="151.3958,385,155.3958,395,159.3958,385,155.3958,389" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="407.8328" x2="407.8328" y1="375" y2="395"/><polygon fill="#181818" points="403.8328,385,407.8328,395,411.8328,385,407.8328,389" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="173.1394" x2="155.3958" y1="307" y2="307"/><line style="stroke:#181818;stroke-width:1.0;" x1="155.3958" x2="155.3958" y1="307" y2="329"/><polygon fill="#181818" points="151.3958,319,155.3958,329,159.3958,319,155.3958,323" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.0891" x2="407.8328" y1="307" y2="307"/><line style="stroke:#181818;stroke-width:1.0;" x1="407.8328" x2="407.8328" y1="307" y2="329"/><polygon fill="#181818" points="403.8328,319,407.8328,329,411.8328,319,407.8328,323" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="407.8328" x2="407.8328" y1="441" y2="446"/><line style="stroke:#181818;stroke-width:1.0;" x1="407.8328" x2="281.6143" y1="446" y2="446"/><line style="stroke:#181818;stroke-width:1.0;" x1="281.6143" x2="281.6143" y1="446" y2="461"/><polygon fill="#181818" points="277.6143,451,281.6143,461,285.6143,451,281.6143,455" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="281.6143" x2="281.6143" y1="210" y2="295"/><polygon fill="#181818" points="2