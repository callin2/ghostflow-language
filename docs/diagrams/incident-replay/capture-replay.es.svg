906" x="21" y="196.0103">escenario y resultado completado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="128.6416" x="21" y="209.0103">en un directorio nuevo</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="127.6689" x="71.6931" y="255"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="107.6689" x="81.6931" y="275.0103">captured (salida 0)</text><ellipse cx="135.5276" cy="319" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="135.5276" cy="319" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.5806" x="476.9431" y="84"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="183.5171" x="486.9431" y="104.0103">verificar el sello del manifiesto y</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="196.5806" x="486.9431" y="117.0103">el hash y tama&#241;o de cada entrada</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3271" x="486.9431" y="130.0103">del inventario</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="207.8716" x="481.2975" y="163"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="187.8716" x="491.2975" y="183.0103">preparar los bytes verificados en</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.9771" x="491.2975" y="196.0103">un directorio temporal privado</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.7725" x="453.8471" y="242"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7725" x="463.8471" y="262.0103">volver a ejecutar; comparar con el registro</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.9116" x="463.8471" y="275.0103">(y con --candidate, si se indica)</text><polygon fill="#F1F1F1" points="320.9334,333,442.3196,333,454.3196,345,442.3196,357,320.9334,357,308.9334,345,320.9334,333" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="173.4243" x="385.6265" y="367.0103">todas las comprobaciones OK</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="121.3862" x="320.9334" y="348.5103">clasificar el resultado</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.7007" x="278.7762" y="390"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.7007" x="288.7762" y="410.0103">completed / compared (salida 0)</text><polygon fill="#F1F1F1" points="631.2935,333,631.2935,333,643.2935,345,631.2935,357,631.2935,357,619.2935,345,631.2935,333" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.0698" x="635.2935" y="367.0103">falta el estado inicial</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="103.3398" x="635.2935" y="380.0103">o faltan artefactos</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.9961" x="643.2935" y="316.0103">corrupci&#243;n, discrepancia de revisi&#243;n,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="276.0596" x="643.2935" y="329.0103">brecha de escaneo, error de tiempo o arranque,</text><text fill="#000000" font-family="Helvetica" font-size