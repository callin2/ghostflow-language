<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="730px" preserveAspectRatio="none" style="width:554px;height:730px;background:#FFFFFF;" version="1.1" viewBox="0 0 554 730" width="554px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=b276e86db0851adc10dbb13c788859575e7f63b2d25ea054b58ecf931c83e390 plantuml=1.2024.7 --><defs/><g><ellipse cx="266.2852" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="308.3423" x="112.114" y="50"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.3423" x="122.114" y="70.0103">Bytes del paquete + trustedKeys + revokedKeyIds</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="261.5933" x="122.114" y="83.0103">+ entradas del host + callback verifyBytecode</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="371.2222" x="80.6741" y="116"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="351.2222" x="90.6741" y="136.0103">1. Esquema exacto de paquete/payload, versiones admitidas</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.4624" x="156.554" y="169"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.4624" x="166.554" y="189.0103">2. Resumen can&#243;nico del payload,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="173.4307" x="166.554" y="202.0103">&gt;= 1 firma activa de confianza</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="310.4688" x="111.0508" y="235"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.4688" x="121.0508" y="255.0103">3. Revisi&#243;n del compilador, sem&#225;ntica del runtime,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.8906" x="121.0508" y="268.0103">ABI del runtime, revisi&#243;n de vinculaci&#243;n</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="311.9351" x="110.3176" y="301"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="291.9351" x="120.3176" y="321.0103">4. Formato del manifiesto, capacidades requeridas</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.6606" x="120.3176" y="334.0103">frente a las entradas del host</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="264.9688" x="133.8008" y="367"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.7852" x="143.8008" y="387.0103">5. Res&#250;menes y enlaces cruzados de</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.9688" x="143.8008" y="400.0103">fuente / GFB / manifiesto / mapa de fuente</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.6924" x="146.439" y="433"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.7852" x="156.439" y="453.0103">6. Metadatos de source-trace frente a</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="219.6924" x="156.439" y="466.0103">las identidades de la fuente y del GFB</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="333.606" x="99.4822" y="499"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="313.606" x="109.4822" y="519.0103">7. verifyBytecode del host(GFB, manifiesto congelado,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="154.667" x="109.4822" y="532.0103">mapa de fuente, identidad)</text><polygon fill="#F1F1F1" points="140.9126,565,391.6577,565,403.6577,578,391.6577,591,140.9126,591,128.9126,578,140.9126,565" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="250.7451" x="140.9126" y="575.0103">&#191;Se superaron todas las comprobaciones y</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="223.2915" x="140.9126" y="588.0103">el callback devolvi&#243; exactamente true?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="118.8008" y="575.0103">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="403.6577" y="575.0103">no</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.8252" x="11" y="601"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.7871" x="21" y="621.0103">Resultado verificado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="195.8252" x="21" y="634.0103">(bytecode.copy() en cada acceso)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.9224" x="283.6965" y="601"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="239.9224" x="293.6965" y="621.0103">PortablePackageError con c&#243;digo estable</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.5615" x="293.6965" y="634.0103">(sin exponer bytecode, sin 