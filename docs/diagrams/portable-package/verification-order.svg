<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="730px" preserveAspectRatio="none" style="width:501px;height:730px;background:#FFFFFF;" version="1.1" viewBox="0 0 501 730" width="501px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=e06a59213c57868ba692883d65214401d19013f54b3930eefb9956832854b73a plantuml=1.2024.7 --><defs/><g><ellipse cx="243.5045" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.5405" x="98.7343" y="50"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.5405" x="108.7343" y="70.0103">Package bytes + trustedKeys + revokedKeyIds</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7324" x="108.7343" y="83.0103">+ host inputs + verifyBytecode callback</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="335.0723" x="75.9684" y="116"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="315.0723" x="85.9684" y="136.0103">1. Exact package/payload schema, supported versions</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.0425" x="151.4833" y="169"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.3315" x="161.4833" y="189.0103">2. Canonical payload digest,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.0425" x="161.4833" y="202.0103">&gt;= 1 active trusted signature</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.188" x="117.9105" y="235"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="231.188" x="127.9105" y="255.0103">3. Compiler revision, runtime semantics,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="165.4707" x="127.9105" y="268.0103">runtime ABI, binding revision</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.8843" x="120.0624" y="301"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.8843" x="130.0624" y="321.0103">4. Manifest format, required capabilities</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="79.4854" x="130.0624" y="334.0103">vs host inputs</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.6416" x="117.1837" y="367"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="232.6416" x="127.1837" y="387.0103">5. Source / GFB / manifest / source-map</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="131.498" x="127.1837" y="400.0103">digests and cross-links</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.2998" x="151.8546" y="433"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.2998" x="161.8546" y="453.0103">6. Source-trace metadata vs</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="149.5762" x="161.8546" y="466.0103">source and GFB identities</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.8188" x="103.0951" y="499"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="260.8188" x="113.0951" y="519.0103">7. Host verifyBytecode(GFB, frozen manifest,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.6626" x="113.0951" y="532.0103">source map, identity)</text><polygon fill="#F1F1F1" points="155.3483,565,331.6608,565,343.6608,578,331.6608,591,155.3483,591,143.3483,578,155.3483,565" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="141.6353" x="155.3483" y="575.0103">Every check passed and</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="176.3125" x="155.3483" y="588.0103">callback returned exactly true?</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="123.1183" y="575.0103">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="343.6608" y="575.0103">no</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.0952" x="11" y="601"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="79.479" x="21" y="621.0103">Verified result</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="195.0952" x="21" y="634.0103">(bytecode.copy() on each access)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.7324" x="246.0952" y="601"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7324" x="256.0952" y="621.0103">PortablePackageError with stable code</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="201.627" x="256.0952" y="634.0103">(no bytecode exposed, no fallback)</text><polygon fill="#F1F1F1" points="243.5045,653,255.5045,665,243.5045,677,231.5045,665,243.5045,653" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="243.5045" cy="708" fill="non