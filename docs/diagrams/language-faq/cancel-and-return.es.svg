<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="599px" preserveAspectRatio="none" style="width:688px;height:599px;background:#FFFFFF;" version="1.1" viewBox="0 0 688 599" width="688px" zoomAndPan="magnify"><title>CancelAndReturn (pregunta 19)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="228.1221" x="223.3423" y="23.5352">CancelAndReturn (pregunta 19)</text><ellipse cx="194.49" cy="63.7983" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="Idle"><rect fill="#F7F9FC" height="50" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="50" x="169.49" y="145.1083"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="169.49" x2="219.49" y1="170.4188" y2="170.4188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.9277" x="183.0261" y="162.6766">Idle</text></g><g id="Working"><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="94.9722" x="7" y="272.1083"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="7" x2="101.9722" y1="297.4188" y2="297.4188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.9556" x="28.5083" y="289.6766">Working</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.9722" x="12" y="314.9872">work = true</text></g><g id="Stopping"><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="253.1113" x="55.93" y="399.7283"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="55.93" x2="309.0413" y1="425.0388" y2="425.0388"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.145" x="154.4132" y="417.2966">Stopping</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.7612" x="60.93" y="442.6072">sin comando</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.1113" x="60.93" y="457.9177">(espera la retroalimentaci&#243;n de paro)</text></g><g id="Returning"><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="149.2446" x="197.86" y="542.6583"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="197.86" x2="347.1046" y1="567.9688" y2="567.9688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.7119" x="241.6264" y="560.2266">Returning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.2446" x="202.86" y="585.5372">return_device = true</text></g><g id="elem_N"><path d="M239.17,43.4883 L239.17,84.1094 L681.8067,84.1094 L681.8067,53.4883 L671.8067,43.4883 L239.17,43.4883 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M671.8067,43.4883 L671.8067,53.4883 L681.8067,53.4883 L671.8067,43.4883 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.123" x="245.17" y="61.0566">Si alguna entrada es desconocida, se conserva la fase.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.6367" x="245.17" y="76.3672">Sin tiempo l&#237;mite: si falta la retroalimentaci&#243;n, la fase se mantiene.</text></g><!--link *start* to Idle--><g id="link_*start*_Idle"><path d="M194.49,74.0483 C194.49,89.8083 194.49,116.3183 194.49,138.9083 " fill="none" id="*start*-to-Idle" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="194.49,144.9083,198.49,135.9083,194.49,139.9083,190.49,135.9083,194.49,144.9083" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Idle to Working--><g id="link_Idle_Working"