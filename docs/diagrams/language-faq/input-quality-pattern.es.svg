<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="537px" preserveAspectRatio="none" style="width:918px;height:537px;background:#FFFFFF;" version="1.1" viewBox="0 0 918 537" width="918px" zoomAndPan="magnify"><title>Patr&#243;n de calidad de entrada para una entrada Bool x (por tick)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="454.3643" x="230.4138" y="33.5352">Patr&#243;n de calidad de entrada para una entrada Bool x (por tick)</text><ellipse cx="463.5959" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="186.8545" x="370.1687" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.8545" x="380.1687" y="110.0566">leer la entrada observed_x</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.9019" x="380.1687" y="125.3672">(Result: ok o fault)</text><polygon fill="#F7F9FC" points="385.3135,158.1094,541.8784,158.1094,553.8784,170.1094,541.8784,182.1094,385.3135,182.1094,373.3135,170.1094,385.3135,158.1094" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.5649" x="385.3135" y="175.0225">&#191;la muestra es ok(value)?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="362.9287" y="167.3672">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.647" x="553.8784" y="167.3672">fault</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="110.7842" x="290.7054" y="192.1094"/><text fill="#000000" font-fami