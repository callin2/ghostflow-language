<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="710px" preserveAspectRatio="none" style="width:523px;height:710px;background:#FFFFFF;" version="1.1" viewBox="0 0 523 710" width="523px" zoomAndPan="magnify"><title>npm test (tools/verify-language.mjs): se detiene en el primer fallo</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="480.2246" x="20" y="33.5352">npm test (tools/verify-language.mjs): se detiene en el primer fallo</text><ellipse cx="261.6123" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="347.7231" x="87.7507" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.7471" x="97.7507" y="110.0566">Comprobaciones previas: Node 22+, host POSIX,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.7231" x="97.7507" y="125.3672">hashes de fuentes, cat&#225;logo, comprobaci&#243;n de docs</text><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="422.7651" x="50.2297" y="158.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402.7651" x="60.2297" y="180.6777">1. Versiones de la cadena de herramientas + cargo fmt --check</text><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="321.1265" x="101.0491" y="213.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.1265" x="111.0491" y="235.9883">2. Compilar el fixture heredado (include_bytes!)</text><rect fill="#F1F1F1" height="35.3105" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="275.39