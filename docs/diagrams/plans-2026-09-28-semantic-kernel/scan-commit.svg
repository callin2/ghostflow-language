<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="500px" preserveAspectRatio="none" style="width:632px;height:500px;background:#FFFFFF;" version="1.1" viewBox="0 0 632 500" width="632px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=2d3f4a871f7be531dd265b98c659be02e553051a7d2b5140fd449e86b6dbcbfc plantuml=1.2024.7 --><defs/><g><ellipse cx="282.3363" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="213.3306" x="175.671" y="50"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7979" x="185.671" y="72.5684">Take one immutable snapshot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.3306" x="185.671" y="87.8789">(inputs + old committed state)</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.1411" x="151.7657" y="120.6211"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1411" x="161.7657" y="143.1895">Evaluate all transitions simultaneously</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.312" x="161.7657" y="158.5">&#8594; candidate state</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.9189" x="145.3768" y="191.2422"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.7466" x="155.3768" y="213.8105">Evaluate requested intents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.9189" x="155.3768" y="229.1211">(unprimed x = old state, x' = candidate)</text><path d="M394.2465,266.8633 L394.2465,283.1738 L374.2465,287.1738 L394.2465,291.1738 L394.2465,307.4844 A0,0 0 0 0 394.2465,307.4844 L620.8153,307.4844 A0,0 0 0 0 620.8153,307.4844 L620.8153,276.8633 L610.8153,266.8633 L394.2465,266.8633 A0,0 0 0 0 394.2465,266.8633 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M610.8153,266.8633 L610.8153,276.8633 L620.8153,276.8633 L610.8153,266.8633 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.6416" x="400.2465" y="284.4316">A constraint that forces an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.5688" x="400.2465" y="299.7422">output safe is NOT a failed scan.</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.8203" x="190.4261" y="261.8633"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.8203" x="200.4261" y="284.4316">Apply Boolean constraints</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.543" x="200.4261" y="299.7422">&#8594; safe intents</text><polygon fill="#F1F1F1" points="165.6124,332.4844,399.0602,332.4844,411.0602,344.4844,399.0602,356.4844,165.6124,356.4844,153.6124,344.4844,165.6124,332.4844" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4478" x="165.6124" y="349.3975">Evaluation and validation succeeded?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.6616" x="132.9508" y="341.7422">yes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="411.0602" y="341.7422">no</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.2617" x="11" y="366.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.728" x="21" y="389.0527">Commit candidate state and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2617" x="21" y="404.3633">requested/safe scan record atomically</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.5601" x="292.2617" y="366.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.5601" x="302.2617" y="389.0527">Roll back: keep prior committed state;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.1953" x="302.2617" y="404.3633">expose no partial candidate</text><polygon fill="#F1F1F1" points="282.3363,423.1055,294.3363,435.1055,282.3363,447.1055,270.3363,435.1055,282.3363,423.1055" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="282.3363" cy="478.1055" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="282.3363" cy="478.1055" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.3363" x2="282.3363" y1="30" y2="50"/><polygon fill="#181818" points="278.3363,40,282.3363,50,286.3363,40,282.3363,44" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.3363" x2="282.3363" y1="100.6211" y2="120.6211"/><polygon fill="#181818" points="278.3363,110.6211,282.3363,120.6211,286.3363,110.6211,282.3363,114.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.3363" x2="282.3363" y1="171.2422" y2="191.2422"/><polygon fill="#181818" points="278.3363,181.2422,282.3363,191.2422,286.3363,181.2422,282.3363,185.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="282.3363" x2="282.3363" y