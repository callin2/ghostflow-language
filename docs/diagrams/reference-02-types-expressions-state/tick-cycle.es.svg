<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="655px" preserveAspectRatio="none" style="width:652px;height:655px;background:#FFFFFF;" version="1.1" viewBox="0 0 652 655" width="652px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=b00b295f2a4d75993e6f2bf770601a6fae497b89dd50dd81edf9488582235a9c plantuml=1.2024.7 --><title>Un tick: leer una instant&#225;nea, calcular candidatos, consolidar juntos</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="487.3408" x="80.8301" y="33.5352">Un tick: leer una instant&#225;nea, calcular candidatos, consolidar juntos</text><ellipse cx="292.6356" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="217.3042" x="183.9835" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.3042" x="193.9835" y="110.0566">Leer la instant&#225;nea de entradas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.373" x="193.9835" y="125.3672">+ estado anterior</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="212.2642" x="186.5035" y="158.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2642" x="196.5035" y="180.6777">Calcular cada estado siguiente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.1914" x="196.5035" y="195.9883">(todos leen valores anteriores)</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="269.3994" x="157.9359" y="228.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.3994" x="167.9359" y="251.2988">Construir el estado candidato completo</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="272.9414" x="156.1649" y="284.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.9414" x="166.1649" y="306.6094">Calcular la intenci&#243;n de salida solicitada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.0068" x="166.1649" y="321.9199">(las expresiones &lt;- pueden leer state')</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="230.0757" x="177.5978" y="354.6621"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.0757" x="187.5978" y="377.2305">Aplicar las restricciones de salida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.0928" x="187.5978" y="392.541">-&gt; intenci&#243;n segura</text><polygon fill="#F7F9FC" points="177.2352,425.2832,408.036,425.2832,420.036,440.5938,408.036,455.9043,177.2352,455.9043,165.2352,440.5938,177.2352,425.2832" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.5024" x="177.2352" y="437.8516">&#191;Alg&#250;n fallo en tiempo de ejecuci&#243;n?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8008" x="177.2352" y="453.1621">(overflow, percent-out-of-range, ...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.3848" x="154.8505" y="437.8516">s&#237;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="420.036" y="437.8516">no</text><path d="M150.4233,465.9043 L150.4233,497.5254 L130.4233,501.5254 L150.4233,505.5254 L150.4233,537.1465 A0,0 0 0 0 150.4233,537.1465 L368.1182,537.1465 A0,0 0 0 0 368.1182,537.1465 L368.1182,475.9043 L358.1182,465.9043 L150.4233,465.9043 A0,0 0 0 0 150.4233,465.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M358.1182,465.9043 L358.1182,475.9043 L368.1182,475.9043 L358.1182,465.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.7217" x="156.4233" y="483.4727">No se consolida nada:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.2988" x="156.4233" y="498.7832">ni estado candidato,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.5205" x="156.4233" y="514.0938">ni intenci&#243;n,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.6948" x="156.4233" y="529.4043">ni entrada exitosa en el journal</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="119.4233" x="11" y="483.8701"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.4233" x="21" y="506.4385">Rechazar el tick</text><ellipse cx="70.7117" cy="583.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="70.7117" cy="583.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="192.8403" x="418.1394" y="465.9043"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.8403" x="428.1394" y="488.4727">Consolidar juntos el estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.2305" x="428.1394" y="503.7832">y los resultados l&#243;gicos</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="252.8828" x="388.1182" y="551.5254"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.353" x="398.1182" y="574.0938">El estado consolidado pasa a ser</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.8828" x="398.1182" y="589.4043">el "estado anterior" del siguiente tick</text><ellipse cx="514.5596" cy="633.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="514.5596" cy="633.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.6356" x2="292.6356" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="288.6356,77.4883,292.6356,87.4883,296.6356,77.4883,292.6356,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.6356" x2="292.6356" y1="138.1094" y2="158.1094"/><polygon fill="#181818" points="288.6356,148.1094,292.6356,158.1094,296.6356,148.1094,292.6356,152.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.6356" x2="292.6356" y1="208.7305" y2="228.7305"/><polygon fill="#181818" points="288.6356,218.7305,292.6356,228.7305,296.6356,218.7305,292.6356,222.7305" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.6356" x2="292.6356" y1="264.041" y2="284.041"/><polygon fill="#181818" points="288.6356,274.041,292.6356,284.041,296.6356,274.041,292.6356,278.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.6356" x2="292.6356" y1="334.6621" y2="354.6621"/><polygon fill="#181818" points="288.6356,344.6621,292.6356,354.6621,296.6356,344.6621,292.6356,348.6621" style="stroke:#181818;stroke-width:1.0;"/><line sty