<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="655px" preserveAspectRatio="none" style="width:557px;height:655px;background:#FFFFFF;" version="1.1" viewBox="0 0 557 655" width="557px" zoomAndPan="magnify"><title>One tick: read a snapshot, compute candidates, commit together</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="464.9805" x="44.6187" y="33.5352">One tick: read a snapshot, compute candidates, commit together</text><ellipse cx="257.3141" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="149.5874" x="182.5204" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.5874" x="192.5204" y="110.0566">Read input snapshot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.2446" x="192.5204" y="125.3672">+ previous state</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="182.0557" x="166.2863" y="158.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.0557" x="176.2863" y="180.6777">Compute every next state</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9268" x="176.2863" y="195.9883">(all read previous values)</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="213.7368" x="150.4457" y="228.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.7368" x="160.4457" y="251.2988">Build complete candidate state</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="231.6689" x="141.4796" y="284.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.6689" x="151.4796" y="306.6094">Compute requested output intent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1973" x="151.4796" y="321.9199">(&lt;- expressions may read state')</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="176.1523" x="169.2379" y="354.6621"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.1523" x="179.2379" y="377.2305">Apply output constraints</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.772" x="179.2379" y="392.541">-&gt; safe intent</text><polygon fill="#F7F9FC" points="141.9137,425.2832,372.7145,425.2832,384.7145,440.5938,372.7145,455.9043,141.9137,455.9043,129.9137,440.5938,141.9137,425.2832" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6416" x="141.9137" y="437.8516">Any runtime fault?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8008" x="141.9137" y="453.1621">(overflow, percent-out-of-range, ...)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.6616" x="109.2521" y="437.8516">yes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="384.7145" y="437.8516">no</text><path d="M140.4575,465.9043 L140.4575,497.5254 L120.4575,501.5254 L140.4575,505.5254 L140.4575,537.1465 A0,0 0 0 0 140.4575,537.1465 L331.5811,537.1465 A0,0 0 0 0 331.5811,537.1465 L331.5811,475.9043 L321.5811,465.9043 L140.4575,465.9043 A0,0 0 0 0 140.4575,465.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M321.5811,465.9043 L321.5811,475.9043 L331.5811,475.9043 L321.5811,465.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.8423" x="146.4575" y="483.4727">Nothing commits:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.4785" x="146.4575" y="498.7832">no candidate state,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.1406" x="146.4575" y="514.0938">no intent,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.1235" x="146.4575" y="529.4043">no successful journal entry</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="109.4575" x="11" y="483.8701"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.4575" x="21" y="506.4385">Reject the tick</text><ellipse cx="65.7288" cy="583.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="65.7288" cy="583.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="177.6187" x="360.0901" y="465.9043"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.6187" x="370.0901" y="488.4727">Commit state and logical</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.3057" x="370.0901" y="503.7832">results together</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="194.6367" x="351.5811" y="551.5254"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.2358" x="361.5811" y="574.0938">Committed state becomes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.6367" x="361.5811" y="589.4043">"previous state" of next tick</text><ellipse cx="448.8994" cy="633.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="448.8994" cy="633.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="257.3141" x2="257.3141" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="253.3141,77.4883,257.3141,87.4883,261.3141,77.4883,257.3141,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="257.3141" x2="257.3141" y1="138.1094" y2="158.1094"/><polygon fill="#181818" points="253.3141,148.1094,257.3141,158.1094,261.3141,148.1094,257.3141,152.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="257.3141" x2="257.3141" y1="208.7305" y2="228.7305"/><polygon fill="#181818" points="253.3141,218.7305,257.3141,228.7305,261.3141,218.7305,257.3141,222.7305" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="257.3141" x2="257.3141" y1="264.041" y2="284.041"/><polygon fill="#181818" points="253.3141,274.041,257.3141,284.041,261.3141,274.041,257.3141,278.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="257.3141" x2="257.3141" y1="334.6621" y2="354.6621"/><polygon fill="#181818" points="253.3141,344.6621,257.3141,354.6621,261.3141,344.6621,257.3141,348.6621" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="65.7288" x2="65.7288" y1="519.1807" y2="572.1465"/><polygon fill="#181818" points="61.7288,562.1465,65.7288,572.1465,69.7288,562.1465,65.7288,566.1465" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="448.8994" x2="448.8994" y1="5