<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="444px" preserveAspectRatio="none" style="width:750px;height:444px;background:#FFFFFF;" version="1.1" viewBox="0 0 750 444" width="750px" zoomAndPan="magnify"><defs/><g><!--entity Host--><g id="elem_Host"><rect fill="#F8F8F8" height="50.6211" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="341.1851" x="51.76" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8125" x="61.76" y="29.5684">Host (navegador o Node)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.1851" x="61.76" y="44.8789">responsable de durabilidad, parada f&#237;sica, fail-safe</text></g><!--entity Station--><g id="elem_Station"><rect fill="#F8F8F8" height="50.6211" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="368.7021" x="7" y="126.27"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.1826" x="17" y="148.8384">station.mjs / policy.mjs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.7021" x="17" y="164.1489">l&#237;mite de la bomba compartida, plantillas de restricci&#243;n</text></g><!--entity Control--><g id="elem_Control"><rect fill="#F8F8F8" height="65.9316" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="333.7075" x="410.5" y="118.62"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.4448" x="420.5" y="141.1884">control-runtime.mjs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.9849" x="420.5" y="156.4989">salidas virtuales, motor de sensores,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.7075" x="420.5" y="171.8095">validaci&#243;n de tipos de entrada, calidad en la traza</text></g><!--entity Wrapper--><g id="elem_Wrapper"><rect fill="#F8F8F8" height="50.6211" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="295.4185" x="429.64" y="245.55"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.9961" x="439.64" y="268.1184">ghostflow-runtime.mjs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.4185" x="439.64" y="283.4289">envoltorio sin dependencias de la ABI cruda</text></g><!--entity Wasm--><g id="elem_Wasm"><rect fill="#F8F8F8" height="50.6211" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="244.5991" x="455.05" y="388.17"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.9814" x="465.05" y="410.7384">cdylib ghostflow-wasm (C ABI)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.5991" x="465.05" y="426.0489">mismo ghostflow-core que ESP-IDF</text></g><!--entity Artifact--><g id="elem_Artifact"><rect fill="#F8F8F8" height="35.3105" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="238.0356" x="458.33" y="14.65"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.0356" x="468.33" y="37.2184">.gfb + .manifest.json de confianza</text></g><!--link Host to Station--><g id="link_Host_Station"><path d="M215.85,57.89 C210.56,77.91 204.6635,100.2193 199.3735,120.2293 " fill="none" id="Host-to-Station" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="197.84,126.03,204.0074,118.3513,199.1179,121.1961,196.2731,116.3066,197.84,126.03" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Host to Control--><g id="link_Host_Control"><path d="M297.2,58.03 C350.2,75.54 416.0828,97.3081 473.6328,116.3181 " fill="none" id="Host-to-Control" style="stroke:#181818;stroke-width:1.0;"/><poly