FF" height="34" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="35.5723" x="245.9533" y="323"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.5723" x="255.9533" y="343.7803">no</text></g><!--entity E--><g id="elem_E"><rect fill="#FFFFFF" height="48" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="209.1094" x="87.1833" y="496"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="113.627" x="97.1833" y="516.7803">fin de la expresi&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.1094" x="97.1833" y="530.7803">(un valor del tipo de resultado)</text></g><!--link C to JF--><g id="link_C_JF"><path d="M175.7433,76.2 C175.7433,93.16 175.7433,113.66 175.7433,130.67 " fill="none" id="C-to-JF" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="175.7433,136.67,179.7433,127.67,175.7433,131.67,171.7433,127.67,175.7433,136.67" style="stroke:#555555;stroke-width:1.0;"/></g><!--link JF to Y--><g id="link_JF_Y"><path d="M118.4733,171.27 C104.3933,178.11 91.0133,187.69 82.7433,201 C71.9533,218.38 74.4064,236.965 79.1064,252.905 " fill="none" id="JF-to-Y" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="80.8033,258.66,82.0947,248.8962,79.3892,253.8641,74.4213,251.1587,80.8033,258.66" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.4009" x="141.5578" y="212.0103">true</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.0298" x="83.7433" y="225.0103">(contin&#250;a en secuencia)</text></g><!--link JF to N--><g id="link_JF_N"><path d="M199.3733,171.48 C209.1333,179.38 219.7633,189.61 226.7433,201 C250.8333,240.35 258.8137,289.4042 261.7237,316.5442 " fill="none" id="JF-to-N" style="stroke:#555555;stroke-width: