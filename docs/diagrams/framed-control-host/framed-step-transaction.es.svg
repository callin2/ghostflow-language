lvetica" font-size="13" lengthAdjust="spacing" textLength="210.9771" x="466.95" y="268.0103">runtime.scan(tiempo l&#243;gico expl&#237;cito)</text><polygon fill="#F1F1F1" points="60.365,301,237.4138,301,249.4138,314,237.4138,327,60.365,327,48.365,314,60.365,301" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="10.1118" x="152.8894" y="337.0103">s&#237;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="177.0488" x="60.365" y="311.0103">&#191;Fallo de acondicionamiento o</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="147.4307" x="60.365" y="324.0103">rechazo nativo conocido?</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.6543" x="29.0623" y="360"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.8652" x="39.0623" y="380.0103">Revertir los acondicionadores;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="219.6543" x="39.0623" y="393.0103">conservar tiempo l&#243;gico e ID de trama</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="275.7788" x="11" y="441"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="255.7788" x="21" y="461.0103">El llamador puede reintentar la misma trama</text><ellipse cx="148.8894" cy="520" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="148.8894" cy="520" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="318.7788,302,586.1611,302,598.1611,314,586.1611,326,318.7788,326,306.7788,314,318.7788,302" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdju