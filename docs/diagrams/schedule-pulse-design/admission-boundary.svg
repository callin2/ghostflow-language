<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="708px" preserveAspectRatio="none" style="width:409px;height:708px;background:#FFFFFF;" version="1.1" viewBox="0 0 409 708" width="409px" zoomAndPan="magnify"><defs/><g><!--cluster Rust core (one portable engine)--><g id="cluster_Rust core (one portable engine)"><rect fill="none" height="375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="211" x="169.64" y="127"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="195.7427" x="177.2687" y="139.0103">Rust core (one portable engine)</text></g><!--entity E--><g id="elem_E"><rect fill="#F1F1F1" height="59" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.8462" x="188.71" y="306"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="102.6162" x="198.71" y="326.0103">Admission engine</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.8462" x="198.71" y="339.0103">(clock, gap, dedup,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.8081" x="198.71" y="352.0103">pulse result)</text></g><!--entity W--><g id="elem_W"><rect fill="#F1F1F1" height="59" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.1289" x="189.07" y="159"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="199.07" y="179.0103">Compiled prelude</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.1099" x="199.07" y="192.0103">(when predicate,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="199.07" y="205.0103">dependency order)</text></g><!--entity T--><g id="elem_T"><rect fill="#F1F1F1" height="46" rx="2