<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="155px" preserveAspectRatio="none" style="width:1018px;height:155px;background:#FFFFFF;" version="1.1" viewBox="0 0 1018 155" width="1018px" zoomAndPan="magnify"><defs/><g><!--entity req--><g id="elem_req"><rect fill="#F1F1F1" height="50.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="146.2295" x="7" y="14.66"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.9688" x="17" y="37.2284">requested</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.2295" x="17" y="52.5389">(control expression)</text></g><!--entity safe--><g id="elem_safe"><rect fill="#F1F1F1" height="65.9316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="124.1968" x="213.23" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.8286" x="223.23" y="29.5684">safe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.1968" x="223.23" y="44.8789">(after arbitration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7847" x="223.23" y="60.1895">and constraints)</text></g><!--entity commit--><g id="elem_commit"><rect fill="#F1F1F1" height="65.9316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="156.0049" x="397.43" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.1929" x="407.43" y="29.5684">logical result</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0049" x="407.43" y="44.8789">committed atomically</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.9097" x="407.43" y="60.1895">(runtime)</text></g><!--entity applied--><g id="elem_applied"><rect fill="#F1F1F1" height="65.9316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="113.5645" x="613.43" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.4839" x="623.43" y="29.5684">applied</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0767" x="623.43" y="44.8789">(renderer sent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.5645" x="623.43" y="60.1895">bus command)</text></g><!--entity conf--><g id="elem_conf"><rect fill="#F1F1F1" height="65.9316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="195.5825" x="801.45" y="7"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.1304" x="811.45" y="29.5684">confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.6426" x="811.45" y="44.8789">(feedback evidence:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.5825" x="811.45" y="60.1895">contact/mechanism moved)</text></g><g id="elem_GMN11"><path d="M787,107.66 L787,148.2811 A0,0 0 0 0 787,148.2811 L1011.4995,148.2811 A0,0 0 0 0 1011.4995,148.2811 L1011.4995,117.66 L1001.4995,107.66 L903.25,107.66 L899.25,73.39 L895.25,107.66 L787,107.66 A0,0 0 0 0 787,107.66 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1001.4995,107.66 L1001.4995,117.66 L1011.4995,117.66 L1001.4995,107.66 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.7739" x="793" y="125.2284">Three different facts:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.4995" x="793" y="140.5389">commit != applied != confirmed</text