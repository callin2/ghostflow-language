<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="919px" preserveAspectRatio="none" style="width:424px;height:919px;background:#FFFFFF;" version="1.1" viewBox="0 0 424 919" width="424px" zoomAndPan="magnify"><title>Availability of one selected channel</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.5166" x="92.4561" y="30.7803">Availability of one selected channel</text><ellipse cx="216.7144" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="59" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.8442" x="102.2922" y="85"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.8442" x="112.2922" y="105.0103">Keep only fresh, linked observations</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="188.6079" x="112.2922" y="118.0103">(invalid reports are excluded and</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.0171" x="112.2922" y="131.0103">recorded in diagnostics)</text><rect fill="#F1F1F1" height="46" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.9434" x="116.7427" y="164"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.6479" x="126.7427" y="184.0103">Collect states for the channel</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="126.7427" y="197.0103">and for each declared resource</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="60.46" x="186.4844" y="280.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="40.46" x="196.4844" y="300.5103">conflict</text><ellipse cx="216.7144" cy="353" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="216.7144" cy="353" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="112.6414,230,320.7874,230,332.7874,243,320.7874,256,112.6414,256,100.6414,243,112.6414,230" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="220.7144" y="266.0103">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="171.9961" x="112.6414" y="240.0103">Do reports disagree about the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.146" x="112.6414" y="253.0103">channel or about any one resource?</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="72.0381" x="180.6953" y="454.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="52.0381" x="190.6953" y="474.5103">unknown</text><ellipse cx="216.7144" cy="527.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="216.7144" cy="527.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="102.1772,406,331.2515,406,343.2515,418,331.2515,430,102.1772,430,90.1772,418,102.1772,406" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="220.7144" y="440.0103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.0742" x="102.1772" y="421.5103">Is `resources` declared on the channel?</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="72.0381" x="180.6953" y="631"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="52.0381" x="190.6953" y="651.0103">unknown</text><ellipse cx="216.7144" cy="703.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="216.7144" cy="703.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#F1F1F1" points="109.0327,580.5,324.396,580.5,336.396,593.5,324.396,606.5,109.0327,606.5,97.0327,593.5,109.0327,580.5" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="220.7144" y="616.5103">no</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.3633" x="109.0327" y="590.5103">Does the channel and every declared</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.2324" x="109.0327" y="603.5103">resource have at least one state?</text><polygon fill="#F1F1F1" points="32,756.5,160.6162,756.5,172.6162,768.5,160.6162,780.5,32,780.5,20,768.5,32,756.5" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="100.3081" y="790.5103">yes</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="128.6162" x="32" y="772.0103">Any state is reserved?</text><rect fill="#F1F1F1" height="33" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.5781" x="61.019" y="813.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="50.5781" x="71.019" y="833.5103">reserved</text><polygon fill="#F1F1F1" points="204.6162,756.5,310.1143,756.5,322.1143,768.5,310.1143,780.5,204.6162,780.5,192.6162,768.5,204.6162,756.5" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="261.3652" y="790.5103