<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="491px" preserveAspectRatio="none" style="width:459px;height:491px;background:#FFFFFF;" version="1.1" viewBox="0 0 459 491" width="459px" zoomAndPan="magnify"><title>Learning through errors (Appendix B)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="271.0791" x="92.8434" y="33.5352">Learning through errors (Appendix B)</text><ellipse cx="235.9243" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="241.019" x="115.4148" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.019" x="125.4148" y="110.0566">Pick one error example (E90-E102)</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="269.939" x="100.9548" y="142.7988"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.9053" x="110.9548" y="165.3672">Predict the diagnostic:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.939" x="110.9548" y="180.6777">where it points and which rule it breaks</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="292.9302" x="89.4592" y="213.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.9302" x="99.4592" y="235.9883">Compile the fence as a lone ghost program</text><polygon fill="#F7F9FC" points="125.1609,268.7305,346.6877,268.7305,358.6877,280.7305,346.6877,292.7305,125.1609,292.7305,113.1609,280.7305,125.1609,268.7305" style="stroke:#4A6FA5;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5269" x="125.1609" y="285.6436">Diagnostic matches the prediction?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.6616" x="92.4993" y="277.9883">yes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.0532" x="358.6877" y="277.9883">no</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="184.3218" x="11" y="302.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.3218" x="21" y="325.2988">Name the broken promise</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.3462" x="21" y="340.6094">and the Reference rule</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="160.1563" x="288.6096" y="302.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.1733" x="298.6096" y="325.2988">Reread the rule</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1563" x="298.6096" y="340.6094">and revise your model</text><polygon fill="#F7F9FC" points="235.9243,359.3516,247.9243,371.3516,235.9243,383.3516,223.9243,371.3516,235.9243,359.3516" style="stroke:#4A6FA5;stroke-width:0.5;"/><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="204.1392" x="133.8547" y="403.3516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.1392" x="143.8547" y="425.9199">Keep only one error at a time</text><ellipse cx="235.9243" cy="469.6621" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="235.9243" cy="469.6621" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;