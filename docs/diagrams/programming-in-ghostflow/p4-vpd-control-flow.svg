<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="417px" preserveAspectRatio="none" style="width:753px;height:417px;background:#FFFFFF;" version="1.1" viewBox="0 0 753 417" width="753px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=cfdf27d30d49cb21448945c48d3485291c74e4e6b62270195b9f8b261fb8c146 plantuml=1.2024.7 --><title>E19-E21: air VPD demand gated by light</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="291.4844" x="224.141" y="23.5352">E19-E21: air VPD demand gated by light</text><!--entity air--><g id="elem_air"><rect fill="#F1F1F1" height="35.3105" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="125.498" x="179.58" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.498" x="189.58" y="67.0566">air: Temperature</text></g><!--entity rh--><g id="elem_rh"><rect fill="#F1F1F1" height="35.3105" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189.9521" x="340.35" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.9521" x="350.35" y="67.0566">humidity: RelativeHumidity</text></g><!--entity light--><g id="elem_light"><rect fill="#F1F1F1" height="35.3105" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="87.8564" x="616.4" y="147.4483"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.8564" x="626.4" y="170.0166">light: PPFD</text></g><!--entity climate--><g id="elem_climate"><rect fill="#F1F1F1" height="50.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.7974" x="244.93" y="139.7983"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.936" x="254.93" y="162.3666">climate = air_vpd(t, rh)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.7974" x="254.93" y="177.6772">(fault if either input faults)</text></g><!--entity demand--><g id="elem_demand"><rect fill="#F1F1F1" height="65.9316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="210.6582" x="7" y="250.4183"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.8774" x="17" y="272.9866">state demand</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.6582" x="17" y="288.2972">ON / OFF / keep in dead band</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.771" x="17" y="303.6077">(fault -&gt; false)</text></g><!--entity day--><g id="elem_day"><rect fill="#F1F1F1" height="50.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="174.8765" x="572.89" y="258.0683"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.8765" x="582.89" y="280.6366">daylight = ppfd &gt;= gate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.771" x="582.89" y="295.9472">(fault -&gt; false)</text></g><!--entity vpd--><g id="elem_vpd"><rect fill="#F1F1F1" height="50.6211" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="171.4043" x="252.63" y="258.0683"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.3252" x="262.63" y="280.6366">air_vpd_value</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.4043" x="262.63" y="295.9472">(0 on fault: placeholder)</text></g><!--entity valid--><g id="elem_valid"><rect fill="#F1F1F1" height="35.3105" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="79.1982" x="458.73" y="265.7283"/><text fill="#000000" font-family="sans-serif" font-si