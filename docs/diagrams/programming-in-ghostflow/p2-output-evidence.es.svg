<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="540px" preserveAspectRatio="none" style="width:513px;height:540px;background:#FFFFFF;" version="1.1" viewBox="0 0 513 540" width="513px" zoomAndPan="magnify"><title>De la intenci&#243;n solicitada a la evidencia f&#237;sica (&#250;ltima fila de E05)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="470.3262" x="20" y="33.5352">De la intenci&#243;n solicitada a la evidencia f&#237;sica (&#250;ltima fila de E05)</text><ellipse cx="136.5603" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="172.1787" x="50.4709" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5161" x="60.4709" y="110.0566">Intenci&#243;n solicitada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.0322" x="60.4709" y="125.3672">(conexiones &lt;-)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1787" x="60.4709" y="140.6777">pump=true, valve=false</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="166.3452" x="53.3877" y="173.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.3618" x="63.3877" y="195.9883">Restricciones de salida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.3452" x="63.3877" y="211.2988">require pump =&gt; valve</text><path d="M261.8513,241.3857 L261.8513,273.0068 L241.8513,277.0068 L261.8513,281.0068 L261.8513,312.6279 A0,0 0 0 0 261.8513,312.6279 L456.9739,312.6279 A0,0 0 0 0 456.9739,312.6279 L456.9739,251.3857 L446.9739,241.3857 L261.8513,241.3857 A0,0 0 0 0 261.8513,241.3857 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M446.9739,241.3857 L446.9739,251.3857 L456.9739,251.3857 L446.9739,241.3857 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1226" x="267.8513" y="258.9541">Las restricciones solo bajan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0825" x="267.8513" y="274.2646">true a false. El runtime</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1797" x="267.8513" y="289.5752">nunca enciende la v&#225;lvula</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.7354" x="267.8513" y="304.8857">para cumplir la regla.</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="210.582" x="31.2693" y="244.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.1108" x="41.2693" y="266.6094">Intenci&#243;n segura</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.582" x="41.2693" y="281.9199">("salida final" en este cap&#237;tulo)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.2729" x="41.2693" y="297.2305">pump=false, valve=false</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="195.8174" x="38.6516" y="332.6279"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.7246" x="48.6516" y="355.1963">Aplicado (applied)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.8174" x="48.6516" y="370.5068">(evidencia del renderizador:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.1636" x="48.6516" y="385.8174">se escribi&#243; el comando)</text><path d="M267.6563,415.9043 L267.6563,447.5254 L247.6563,451.5254 L267.6563,455.5254 L267.6563,487.1465 A0,0 0 0 0 267.6563,487.1465 L486.8618,487.1465 A0,0 0 0 0 486.8618,487.1465 L486.8618,425.9043 L476.8618,415.9043 L267.6563,415.9043 A0,0 0 0 0 267.6563,415.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M476.8618,415.9043 L476.8618,425.9043 L486.8618,425.9043 L476.8618,415.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.7783" x="273.6563" y="433.4727">Aplicado y confirmado quedan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0933" x="273.6563" y="448.7832">fuera de la intenci&#243;n de salida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.9624" x="273.6563" y="464.0938">del lenguaje. safe=true no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2056" x="273.6563" y="479.4043">prueba que la bomba funcion&#243;.</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="222.1919" x="25.4644" y="418.5596"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.0869" x="35.4644" y="441.1279">Confirmado (confirmed)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1919" x="35.4644" y="456.4385">(evidencia de retroalimentaci&#243;n:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.1309" x="35.4644" y="471.749">final de carrera, encoder, ...)</text><ellipse cx="136.5603" cy="518.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="136.5603" cy="518.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="132.5603,77.4883,136.5603,87.4883,140.5603,77.4883,136.5603,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="153.4199" y2="173.4199"/><polygon fill="#181818" points="132.5603,163.4199,136.5603,173.4199,140.5603,163.4199,136.5603,167.4199" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="224.041" y2="244.041"/><polygon fill="#181818" points="132.5603,234.041,136.5603,244.041,140.5603,234.041,136.5603,238.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="309.9727" y2="332.6279"/><polygon fill="#181818" points="132.5603,322.6279,136.5603,332.6279,140.5603,322.6279,136.5603,326.6279" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="398.5596" y2="418.5596"/><polygon fill="#181818" points="132.5603,408.5596,136.5603,418.5596,140.5603,408.5596,136.5603,412.5596" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.5603" x2="136.5603" y1="484.4912" y2="507.1465"/><polygon fill="#181818" points="132.5603,497.1465,136.5603,507.1465,140.5603,497.1465,136.5603,501.1465" style="stroke:#181818;stroke-width:1.0;"/><!--SRC=[RPB1RXCn48Rl-nIZSaca4e6W85A2548Z8N62QouJUtOxhTVUZks5zcruW9vwuxelrl46qZRq4ZdxZ__vvnl7I_OT2hOGpz66d-mRgD55gk9UiLHZTcaTVFh1DmIltpmIboPnp-dwCvhBHaBsTXLS47YnVh_-i5uzLnd4alojUhjyjrwUL8cJ8_X2u13O9_A6XpiFCJWsdD0YO96ePriqX7guZMmG9iCVbxZL3wow9JXxTJAjgfXGKZN_-fpLnazCyFIBzIV2nvVJZUzososIP