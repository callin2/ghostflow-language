<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="491px" preserveAspectRatio="none" style="width:513px;height:491px;background:#FFFFFF;" version="1.1" viewBox="0 0 513 491" width="513px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=88e930c3fef43a3193ccf2a6d93de417e29b3a23a7d77f797ae3687c6fa619d6 plantuml=1.2024.7 --><title>Aprender a trav&#233;s de los errores (Ap&#233;ndice B)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="329.3213" x="90.3444" y="33.5352">Aprender a trav&#233;s de los errores (Ap&#233;ndice B)</text><ellipse cx="275.7241" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="250.6802" x="150.384" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.6802" x="160.384" y="110.0566">Elija un ejemplo de error (E90-E102)</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="240.0415" x="155.7034" y="142.7988"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.4824" x="165.7034" y="165.3672">Prediga el diagn&#243;stico:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.0415" x="165.7034" y="180.6777">d&#243;nde se&#241;ala y qu&#233; regla incumple</text><rect fill="#F7F9FC" height="35.3105" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="347.8945" x="101.7769" y="213.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.8945" x="111.7769" y="235.9883">Compile el bloque como un programa ghost aislado</text><polygon fill="#F7F9FC" points="142.0837,268.7305,409.3645