z</text><ellipse cx="275.7241" cy="469.6621" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="275.7241" cy="469.6621" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="275.7241" x2="275.7241" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="271.7241,77.4883,275.7241,87.4883,279.7241,77.4883,275.7241,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="275.7241" x2="275.7241" y1="122.7988" y2="142.7988"/><polygon fill="#181818" points="271.7241,132.7988,275.7241,142.7988,279.7241,132.7988,275.7241,136.7988" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="275.7241" x2="275.7241" y1="193.4199" y2="213.4199"/><polygon fill="#181818" points="271.7241,203.4199,275.7241,213.4199,279.7241,203.4199,275.7241,207.4199" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.0837" x2="120.0837" y1="280.7305" y2="280.7305"/><line style="stroke:#181818;stroke-width:1.0;" x1="120.0837" x2="120.0837" y1="280.7305" y2="302.7305"/><polygon fill="#181818" points="116.0837,292.7305,120.0837,302.7305,124.0837,292.7305,120.0837,296.7305" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="421.3645" x2="431.3645" y1="280.7305" y2="280.7305"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.3645" x2="431.3645" y1="280.7305" y2="302.7305"/><polygon fill="#181818" points="427.3645,292.7305,431.3645,302.7305,435.3645,292.7305,431.3645,296.7305" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="120.0837" x2="120.0837" y1="353.3516" y2="371.3516"/><line style="stroke:#181818;stroke-width:1.0;" x1="120.0837" x2="263.7241" y1="371.3516" y2="371.3516"/><polygon fill="#181818" points="253.7241,367.3516,263.7241,371.3516,253.7241,375.3516,257.7241,371.3516" style="