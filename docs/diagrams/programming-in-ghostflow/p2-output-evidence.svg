<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="540px" preserveAspectRatio="none" style="width:459px;height:540px;background:#FFFFFF;" version="1.1" viewBox="0 0 459 540" width="459px" zoomAndPan="magnify"><title>From requested intent to physical evidence (E05 last row)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="416.9922" x="20" y="33.5352">From requested intent to physical evidence (E05 last row)</text><ellipse cx="128.2571" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="172.1787" x="42.1677" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.8438" x="52.1677" y="110.0566">Requested intent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.4058" x="52.1677" y="125.3672">(&lt;- connections)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1787" x="52.1677" y="140.6777">pump=true, valve=false</text><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="166.3452" x="45.0845" y="173.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.2695" x="55.0845" y="195.9883">Output constraints</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.3452" x="55.0845" y="211.2988">require pump =&gt; valve</text><path d="M251.6787,241.3857 L251.6787,273.0068 L231.6787,277.0068 L251.6787,281.0068 L251.6787,312.6279 A0,0 0 0 0 251.6787,312.6279 L434.1567,312.6279 A0,0 0 0 0 434.1567,312.6279 L434.1567,251.3857 L424.1567,241.3857 L251.6787,241.3857 A0,0 0 0 0 251.6787,241.3857 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M424.1567,241.3857 L424.1567,251.3857 L434.1567,251.3857 L424.1567,241.3857 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.502" x="257.6787" y="258.9541">Constraints only lower</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.478" x="257.6787" y="274.2646">true to false. The runtime</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8613" x="257.6787" y="289.5752">never turns the valve on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.4863" x="257.6787" y="304.8857">to satisfy the rule.</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="206.8433" x="24.8354" y="244.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.1772" x="34.8354" y="266.6094">Safe intent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.8433" x="34.8354" y="281.9199">("final output" in this chapter)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.2729" x="34.8354" y="297.2305">pump=false, valve=false</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="162.7524" x="46.8809" y="332.6279"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.2739" x="56.8809" y="355.1963">Applied</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.5132" x="56.8809" y="370.5068">(renderer evidence:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.7524" x="56.8809" y="385.8174">command was written)</text><path d="M220.5784,415.9043 L220.5784,447.5254 L200.5784,451.5254 L220.5784,455.5254 L220.5784,487.1465 A0,0 0 0 0 220.5784,487.1465 L429.9768,487.1465 A0,0 0 0 0 429.9768,487.1465 L429.9768,425.9043 L419.9768,415.9043 L220.5784,415.9043 A0,0 0 0 0 220.5784,415.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M419.9768,415.9043 L419.9768,425.9043 L429.9768,425.9043 L419.9768,415.9043 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.9146" x="226.5784" y="433.4727">Applied and confirmed are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4351" x="226.5784" y="448.7832">outside the language's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2578" x="226.5784" y="464.0938">output intent. Safe=true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.3984" x="226.5784" y="479.4043">does not prove the pump ran.</text><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="144.6426" x="55.9358" y="418.5596"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.4663" x="65.9358" y="441.1279">Confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.6426" x="65.9358" y="456.4385">(feedback evidence:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.9917" x="65.9358" y="471.749">limit, encoder, ...)</text><ellipse cx="128.2571" cy="518.1465" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="128.2571" cy="518.1465" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="124.2571,77.4883,128.2571,87.4883,132.2571,77.4883,128.2571,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="153.4199" y2="173.4199"/><polygon fill="#181818" points="124.2571,163.4199,128.2571,173.4199,132.2571,163.4199,128.2571,167.4199" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="224.041" y2="244.041"/><polygon fill="#181818" points="124.2571,234.041,128.2571,244.041,132.2571,234.041,128.2571,238.041" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="309.9727" y2="332.6279"/><polygon fill="#181818" points="124.2571,322.6279,128.2571,332.6279,132.2571,322.6279,128.2571,326.6279" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="398.5596" y2="418.5596"/><polygon fill="#181818" points="124.2571,408.5596,128.2571,418.5596,132.2571,408.5596,128.2571,412.5596" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="128.2571" x2="128.2571" y1="484.4912" y2="507.1465"/><polygon fill="#181818" points="124.2571,497.1465,128.2571,507.1465,132.2571,497.1465,128.2571,501.1465" style="stroke:#181818;stroke-width:1.0;"/><!--SRC=[RL5DZzD03BtdLrZBWQrK8X0igoqKgLJaYiHox6L8d6Iq4pjuFAdAhyUJRDcguZZp_Bxi-EHfTE86YBrh-EYfWzQ5Y4NyXpJOkXIqOj97_mVXtViBS5UhdxoUlhhwgHDErEmviC2hwhvwgFR_csHfK9wdFkm-LhkxGhq6X4fu0C7V2QDY0vuKIK4PnluKVUq2uEGRf1hXzjlREmWkAWWVLqKHrOaMcnzNv0FTVdu3DHEXkJF5rO76D8nRbOHhc5oOS3lt_LHilYSTa-RfgE9C81uef_62a4cm_R8mRFRHjVZYSTDwidGy2zpOFsZl8zIz6nNbx3dxN9aIAuBuhjS2OF_Y34pX186FA0Raj7aFCwc4dxrn4gaVq4322GKq2KMpnKNV-9d749tws9vcH5B0ia1g8DiMczqu1e-D5H3xH36Pyu8t1wfv69pD7bs4etYrhYjhRY5RByDCQn6RNtRuIr