<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="676px" preserveAspectRatio="none" style="width:255px;height:676px;background:#FFFFFF;" version="1.1" viewBox="0 0 255 676" width="255px" zoomAndPan="magnify"><defs/><g><!--entity civil--><g id="elem_civil"><rect fill="#F1F1F1" height="48" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="212.165" x="7" y="7"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.2275" x="17" y="27.7803">Civil clock</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="17" y="41.7803">(time zone, DST, trusted clock)</text></g><!--entity sched--><g id="elem_sched"><rect fill="#F1F1F1" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="136.7236" x="44.72" y="130"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.0479" x="54.72" y="150.7803">schedule starts:</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.7236" x="54.72" y="164.7803">DailySlots&lt;15min&gt;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="77.8477" x="54.72" y="178.7803">06:00, 18:45</text></g><!--entity due--><g id="elem_due"><rect fill="#F1F1F1" height="62" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="159.2754" x="33.44" y="267"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="61.4756" x="43.44" y="287.7803">starts.due</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.4893" x="43.44" y="301.7803">(true on the tick</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="139.2754" x="43.44" y="315.7803">an occurrence arrives)</text></g><!--en