<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="451px" preserveAspectRatio="none" style="width:534px;height:451px;background:#FFFFFF;" version="1.1" viewBox="0 0 534 451" width="534px" zoomAndPan="magnify"><title>E03: running y restart_blocked (una transici&#243;n por tick)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="399.9023" x="60.2188" y="23.5352">E03: running y restart_blocked (una transici&#243;n por tick)</text><g id="Stopped"><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="157.4395" x="267.62" y="222.0483"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="267.62" x2="425.0595" y1="277.9799" y2="277.9799"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.0781" x="317.8007" y="239.6166">Detenido</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.375" x="301.6522" y="254.9272">running=false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4395" x="277.62" y="270.2377">restart_blocked=false</text></g><g id="Running"><rect fill="#F7F9FC" height="50.6211" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="105.2808" x="41.7" y="61.4583"/><line style="stroke:#4A6FA5;stroke-width:0.5;" x1="41.7" x2="146.9808" y1="102.0794" y2="102.0794"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.7681" x="61.4563" y="79.0266">En marcha</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2808" x="51.7" y="94.3372">running=true</text></g><g id="Blocked"><rect fill="#F7F9FC" height="65.9316" rx="12.5" ry="12.5" style="stroke:#4A6FA5;stroke-width:0.5;" width="162.8984" x="126.89" y="379.9783"