<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="482px" preserveAspectRatio="none" style="width:669px;height:482px;background:#FFFFFF;" version="1.1" viewBox="0 0 669 482" width="669px" zoomAndPan="magnify"><!-- ghostflow-diagram source-sha256=a6002e93343c026f985201b606ddb6c6fce0643b76e873c7f08200e3269202f5 plantuml=1.2024.7 --><title>Agreed amendment - proposed, NOT implemented</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="366.6182" x="150.0226" y="33.5352">Agreed amendment - proposed, NOT implemented</text><ellipse cx="356.0074" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.0967" x="283.9591" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.0967" x="293.9591" y="110.0566">One action changes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.9312" x="293.9591" y="125.3672">several properties</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.3857" x="258.3146" y="158.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3857" x="268.3146" y="180.6777">Validate the complete event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0742" x="268.3146" y="195.9883">(as ONE atomic event)</text><polygon fill="#F1F1F1" points="301.297,228.7305,410.7179,228.7305,422.7179,240.7305,410.7179,252.7305,301.297,252.7305,289.297,240.7305,301.297,228.7305" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.4209" x="301.297" y="245.6436">Every value valid?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.6616" x="268.6354" y="237.9883">yes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.5835" x="422.7179" y="237.9883">any invalid</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="250.7246" x="11" y="262.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.4595" x="21" y="285.2988">Apply all values when the event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.7246" x="21" y="300.6094">is processed (even during operation)</text><path d="M265.5413,338.3516 L265.5413,362.3174 L245.5413,366.3174 L265.5413,370.3174 L265.5413,394.2832 A0,0 0 0 0 265.5413,394.2832 L472.6418,394.2832 A0,0 0 0 0 472.6418,394.2832 L472.6418,348.3516 L462.6418,338.3516 L265.5413,338.3516 A0,0 0 0 0 265.5413,338.3516 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M462.6418,338.3516 L462.6418,348.3516 L472.6418,348.3516 L462.6418,338.3516 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1006" x="271.5413" y="355.9199">No source rewrite, recompile,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.6597" x="271.5413" y="371.2305">firmware/bytecode update,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.374" x="271.5413" y="386.541">or controller stop/restart</text><rect fill="#F1F1F1" height="65.9316" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.3579" x="27.1833" y="333.3516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.3579" x="37.1833" y="355.9199">Keep program and run identity;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.0347" x="37.1833" y="371.2305">advance settings revision /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.8911" x="37.1833" y="386.541">effective event position</text><rect fill="#F1F1F1" height="50.6211" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.0215" x="492.6418" y="262.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.0215" x="502.6418" y="285.2988">Reject the whole event;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.0859" x="502.6418" y="300.6094">no mutation</text><polygon fill="#F1F1F1" points="356.0074,405.2832,368.0074,417.2832,356.0074,429.2832,344.0074,417.2832,356.0074,405.2832" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="356.0074" cy="460.2832" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="356.0074" cy="460.2832" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356.0074" x2="356.0074" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="352.0074,77.4883,356.0074,87.4883,360.0074,77.4883,356.0074,81.4883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356.0074" x2="356.0074" y1="138.1094" y2="158.1094"/><polygon fill="#181818" points="352.0074,148.1094,356.0074,158.1094,360.0074,148.1094,356.0074,152.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.3623" x2="136.3623" y1="313.3516" y2="333.3516"/><polygon fill="#181818" points="132.3623,323.3516,136.3623,333.3516,140.3623,323.3516,136.3623,327.3516" style="stroke:#181818;stroke-width:1.0;"/><