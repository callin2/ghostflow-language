[package]
name = "ghostflow-package"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strict native verifier for signed GhostFlow portable packages"

[dependencies]
ghostflow-core = { path = "../ghostflow-core" }
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu-js = "1"
sha2 = "0.10"
