name: Lean compiler certificates

on:
  pull_request:
    paths:
      - .github/workflows/lean-proof.yml
      - experiments/bool-translation-validation/**
      - experiments/bool-sensor-validation/**
      - experiments/bool-sensor-state-validation/**
      - experiments/int32-codec-validation/**
      - experiments/two-sensor-provenance/**
      - experiments/elapsed-epoch-validation/**
      - experiments/elapsed-clock-bounds/**
      - experiments/elapsed-duration-output/**
      - experiments/lean-outcome.mjs
      - tests/bool-translation-validation.test.mjs
      - tests/bool-generated-certificates.test.mjs
      - tests/bool-sensor-validation.test.mjs
      - tests/bool-sensor-state-validation.test.mjs
      - tests/int32-codec-validation.test.mjs
      - tests/two-sensor-provenance.test.mjs
      - tests/elapsed-epoch-validation.test.mjs
      - tests/elapsed-clock-bounds.test.mjs
      - tests/elapsed-duration-output.test.mjs
      - tests/lean-outcome.test.mjs
      - tests/lean-proof-workflow.test.mjs
      - tools/**
      - crates/ghostflow-core/src/**
      - package.json
      - package-lock.json
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/lean-proof.yml
      - experiments/bool-translation-validation/**
      - experiments/bool-sensor-validation/**
      - experiments/bool-sensor-state-validation/**
      - experiments/int32-codec-validation/**
      - experiments/two-sensor-provenance/**
      - experiments/elapsed-epoch-validation/**
      - experiments/elapsed-clock-bounds/**
      - experiments/elapsed-duration-output/**
      - experiments/lean-outcome.mjs
      - tests/bool-translation-validation.test.mjs
      - tests/bool-generated-certificates.test.mjs
      - tests/bool-sensor-validation.test.mjs
      - tests/bool-sensor-state-validation.test.mjs
      - tests/int32-codec-validation.test.mjs
      - tests/two-sensor-provenance.test.mjs
      - tests/elapsed-epoch-validation.test.mjs
      - tests/elapsed-clock-bounds.test.mjs
      - tests/elapsed-duration-output.test.mjs
      - tests/lean-outcome.test.mjs
      - tests/lean-proof-workflow.test.mjs
      - tools/**
      - crates/ghostflow-core/src/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - verifier: bool-translation-validation
            evidence_dir: bool-pc-validation
          - verifier: bool-sensor-validation
            evidence_dir: bool-sensor-validation
          - verifier: bool-sensor-state-validation
            evidence_dir: bool-sensor-state-validation
          - verifier: int32-codec-validation
            evidence_dir: int32-codec-validation
          - verifier: two-sensor-provenance
            evidence_dir: two-sensor-provenance
          - verifier: elapsed-epoch-validation
            evidence_dir: elapsed-epoch-validation
          - verifier: elapsed-clock-bounds
            evidence_dir: elapsed-clock-bounds
          - verifier: elapsed-duration-output
            evidence_dir: elapsed-duration-output
    steps:
      - name: Checkout proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare suite evidence directory
        shell: bash
        env:
          PROOF_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="build/${{ matrix.evidence_dir }}"
          mkdir -p "$evidence_dir"
          {
            printf 'verifier=%s\n' '${{ matrix.verifier }}'
            printf 'checkout_sha=%s\n' "$PROOF_CHECKOUT_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'node='; node --version
            printf 'npm='; npm --version
            uname -a
          } 2>&1 | tee "$evidence_dir/setup.log"
      - name: Install locked Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "build/${{ matrix.evidence_dir }}/npm-ci.log"
      - name: Install pinned Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          {
            archive="$RUNNER_TEMP/elan-v4.1.2-linux-x86_64.tar.gz"
            installer="$RUNNER_TEMP/elan-v4.1.2"
            mkdir -p "$installer"
            curl --fail --location --silent --show-error \
              https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
              --output "$archive"
            printf '%s  %s\n' f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b "$archive" | sha256sum --check
            tar -xzf "$archive" -C "$installer"
            "$installer/elan-init" -y --default-toolchain none --no-modify-path
            elan_version="$("$HOME/.elan/bin/elan" --version)"
            printf '%s\n' "$elan_version"
            [[ "$elan_version" =~ ^elan[[:space:]]4\.1\.2([[:space:]]|$) ]] || { echo 'unexpected elan version' >&2; exit 1; }
            "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.19.0
            "$HOME/.elan/bin/elan" default leanprover/lean4:v4.19.0
            "$HOME/.elan/bin/elan" which lean
          } 2>&1 | tee "build/${{ matrix.evidence_dir }}/lean-install.log"
      - name: Check proof bridge tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bool-translation-validation.test.mjs tests/bool-generated-certificates.test.mjs tests/bool-sensor-validation.test.mjs tests/bool-sensor-state-validation.test.mjs tests/int32-codec-validation.test.mjs tests/lean-outcome.test.mjs tests/two-sensor-provenance.test.mjs tests/elapsed-epoch-validation.test.mjs tests/elapsed-clock-bounds.test.mjs tests/elapsed-duration-output.test.mjs tests/lean-proof-workflow.test.mjs 2>&1 | tee "build/${{ matrix.evidence_dir }}/node-test.log"
      - name: Check suite with Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          node "experiments/${{ matrix.verifier }}/verify.mjs" \
            --lean "$lean_bin" --evidence-dir "build/${{ matrix.evidence_dir }}" \
            2>&1 | tee "build/${{ matrix.evidence_dir }}/verify.log"
      - name: Upload proof evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-${{ matrix.verifier }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/${{ matrix.evidence_dir }}/
          if-no-files-found: warn
          retention-days: 30

  proof:
    name: proof
    needs: [lean-proofs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Lean proof suite to succeed
        env:
          LEAN_PROOFS_RESULT: ${{ needs.lean-proofs.result }}
        run: |
          if [[ "$LEAN_PROOFS_RESULT" != "success" ]]; then
            printf 'Lean proof matrix result was %s\n' "$LEAN_PROOFS_RESULT" >&2
            exit 1
          fi
