name: Verified WASM

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact GhostFlow language commit SHA to verify
        required: false
        type: string

permissions:
  contents: read

# Cancel only obsolete heads of the same PR. Pushes and exact-SHA manual
# handoffs retain independent run IDs and cannot cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Checkout CI source and comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check CI contracts before compiler lanes
        run: node --test --test-reporter=tap tests/ci-verification-routing.test.mjs tests/verified-wasm-artifact.test.mjs
      - name: Classify exact changed paths
        id: route
        run: node tools/ci-verification-routing.mjs classify

  docs:
    name: Verify documentation
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout documentation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install documentation dependencies
        run: npm ci --ignore-scripts
      - name: Check all documentation translations and indexes
        run: npm run docs:check
      - name: Test documentation contracts, verification routing and final result
        run: node --test tests/ci-verification-routing.test.mjs tests/doc-index.test.mjs

  verify:
    name: Verify WASM (${{ matrix.label }})
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current
            source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.source_sha || github.sha }}
          - label: frontend-pin
            source_sha: b2f2874dd0238207558dfa4cc83077d322356a6c

    steps:
      - name: Checkout CI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ci
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Validate tested source SHA format
        env:
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: ${{ matrix.label == 'current' }}
          submodules: false

      - name: Verify tested source commit
        working-directory: source
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "checked out source does not match the tested source SHA" >&2
            echo "expected: $EXPECTED_SOURCE_SHA" >&2
            echo "actual:   $actual_source_sha" >&2
            exit 1
          fi

      - name: Set up Node.js 22
        id: verified_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Rust stable and WASM tooling
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      - name: Install source dependencies
        working-directory: source
        run: npm ci --ignore-scripts

      # Cache dependency compilation only. Workspace runners, WASM and build/
      # evidence are rebuilt/verified by the tested source's normal gates.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> target
          key: ${{ matrix.label }}
          cache-bin: false

      - name: Fetch locked Rust dependencies
        working-directory: source
        run: cargo fetch --locked

      - name: Run verified WASM packaging unit test
        run: node --test ci/tests/verified-wasm-artifact.test.mjs

      - name: Test current source build identity with local authority
        if: ${{ matrix.label == 'current' }}
        working-directory: source
        run: npm run test:build-identity

      - name: Run source verification
        working-directory: source
        run: npm test

      - name: Set up Node.js 24 for current-source coverage
        if: ${{ matrix.label == 'current' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run current-source coverage gate
        if: ${{ matrix.label == 'current' }}
        working-directory: source
        run: npm run test:coverage

      - name: Restore verified Node.js for packaging
        if: ${{ matrix.label == 'current' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.verified_node.outputs.node-version }}

      - name: Package verified WASM handoff
        id: package
        run: node ci/tools/package-verified-wasm.mjs source handoff

      - name: Upload verified WASM handoff
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghostflow-wasm-${{ matrix.label }}-${{ steps.package.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoff
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure verification report
        if: ${{ failure() && hashFiles('source/build/verification.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghostflow-verification-failure-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/verification.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: Verification result
    needs: [classify, docs, verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout result gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require successful selected verification
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-verification-routing.mjs result
